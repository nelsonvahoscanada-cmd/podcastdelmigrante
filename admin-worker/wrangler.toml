# podcastdelmigrante-admin — panel privado de Perfiles Empresariales.
# Worker NUEVO e independiente. NO reemplaza ni modifica
# podcastdelmigrante-analytics (el que recibe /api/events).

name = "podcastdelmigrante-admin"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Conservar al desplegar las variables ya configuradas en el panel de
# Cloudflare (ACCESS_TEAM_DOMAIN, ACCESS_AUD). Sin esto, un «wrangler deploy»
# las borraría y el panel quedaría bloqueado (falla cerrado con 403).
keep_vars = true

# Sin URLs alternativas: solo se entra por el dominio protegido con Access.
workers_dev = false
preview_urls = false

routes = [
  { pattern = "admin.podcastdelmigrante.com", custom_domain = true }
]

[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "drop-trailing-slash"
not_found_handling = "none"
# Toda petición (incluidos HTML/JS/CSS del panel) pasa primero por el Worker,
# que verifica la identidad antes de entregar cualquier archivo.
run_worker_first = true

# MISMA base D1 que usa podcastdelmigrante-analytics. Este Worker solo
# ejecuta SELECT de agregados.
[[d1_databases]]
binding = "DB"
database_name = "podcastdelmigrante-analytics"
database_id = "6acee1af-85c4-485c-9fd5-1e2cb9f2066b"   # Cloudflare → D1 → podcastdelmigrante-analytics → Database ID

# Solicitudes del Directorio Empresarial (base D1 SEPARADA de las
# estadísticas; ya creada en Cloudflare con la tabla business_applications
# de db/directorio/0001_solicitudes.sql). El panel la lee y solo cambia el
# estado de revisión de una solicitud.
[[d1_databases]]
binding = "DIRECTORIO_DB"
database_name = "podcastdelmigrante-directorio"
database_id = "de6b6950-eab9-4cba-827a-599b76156084"   # Cloudflare → D1 → podcastdelmigrante-directorio → Database ID

# Imágenes de las solicitudes: bucket R2 PRIVADO (sin acceso público), el
# mismo que usa el sitio con el binding SOLICITUDES. El panel solo las lee.
[[r2_buckets]]
binding = "SOLICITUDES"
bucket_name = "podcastdelmigrante-directorio"

[vars]
REPORT_TIMEZONE = "America/Edmonton"
# ACCESS_TEAM_DOMAIN y ACCESS_AUD NO se declaran aquí: viven en Cloudflare →
# Workers & Pages → podcastdelmigrante-admin → Settings → Variables and Secrets
# y se conservan gracias a keep_vars. (Declararlos vacíos los borraría.)
#   ACCESS_TEAM_DOMAIN  Zero Trust → Settings → Team domain (ej. https://eradio.cloudflareaccess.com)
#   ACCESS_AUD          Zero Trust → Access → Applications → (app del panel) → Application Audience (AUD) Tag
# ADMIN_EMAILS se configura como SECRETO (no aquí):
#   npx wrangler secret put ADMIN_EMAILS     → "correo1@dominio.com,correo2@dominio.com"
