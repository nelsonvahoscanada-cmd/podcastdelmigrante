<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 600" role="img" aria-hidden="true">
  <!-- Escena navideña decorativa del tema «navidad» de los perfiles Premium.
       Ilustración propia de El Podcast del Migrante (sin recursos de terceros). -->
  <defs>
    <radialGradient id="halo" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#f6d58a" stop-opacity=".38"/>
      <stop offset=".55" stop-color="#d9a441" stop-opacity=".10"/>
      <stop offset="1" stop-color="#d9a441" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="oro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7e2a6"/>
      <stop offset=".45" stop-color="#d4a84b"/>
      <stop offset="1" stop-color="#9c7322"/>
    </linearGradient>
    <linearGradient id="pino" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f6b47"/>
      <stop offset="1" stop-color="#0e3a26"/>
    </linearGradient>
    <linearGradient id="vino" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8e1b2e"/>
      <stop offset="1" stop-color="#5c0f1d"/>
    </linearGradient>
    <linearGradient id="esmeralda" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d7a55"/>
      <stop offset="1" stop-color="#0f4b33"/>
    </linearGradient>
    <filter id="brillo" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <ellipse cx="300" cy="300" rx="300" ry="300" fill="url(#halo)"/>

  <!-- Árbol -->
  <g>
    <rect x="290" y="500" width="32" height="46" rx="3" fill="#4a2a17"/>
    <path d="M306 70 L420 250 H372 L452 380 H398 L488 512 H124 L214 380 H160 L240 250 H192 Z" fill="url(#pino)"/>
    <path d="M306 70 L420 250 H372 L452 380 H398 L488 512 H306 Z" fill="#000" opacity=".12"/>
    <!-- Guirnaldas doradas -->
    <g fill="none" stroke="url(#oro)" stroke-width="3" stroke-linecap="round" opacity=".95">
      <path d="M232 214 Q300 252 386 206"/>
      <path d="M200 330 Q300 382 418 318"/>
      <path d="M168 452 Q306 520 452 444"/>
    </g>
    <!-- Esferas doradas y rojo vino -->
    <g>
      <circle cx="262" cy="236" r="9" fill="url(#oro)"/>
      <circle cx="350" cy="232" r="8" fill="url(#vino)"/>
      <circle cx="230" cy="352" r="10" fill="url(#vino)"/>
      <circle cx="306" cy="362" r="11" fill="url(#oro)"/>
      <circle cx="390" cy="344" r="9" fill="url(#oro)"/>
      <circle cx="200" cy="470" r="11" fill="url(#oro)"/>
      <circle cx="270" cy="490" r="9" fill="url(#vino)"/>
      <circle cx="350" cy="492" r="12" fill="url(#oro)"/>
      <circle cx="424" cy="468" r="10" fill="url(#vino)"/>
      <circle cx="306" cy="170" r="8" fill="url(#oro)"/>
    </g>
    <!-- Luces cálidas -->
    <g fill="#ffe7a8" filter="url(#brillo)" opacity=".85">
      <circle cx="246" cy="290" r="4"/><circle cx="364" cy="282" r="4"/><circle cx="286" cy="420" r="4"/>
      <circle cx="420" cy="410" r="4"/><circle cx="182" cy="410" r="4"/><circle cx="330" cy="130" r="3"/>
    </g>
    <!-- Estrella -->
    <path d="M306 34 l9 22 24 2 -18 16 6 23 -21 -13 -21 13 6 -23 -18 -16 24 -2 z" fill="url(#oro)"/>
    <circle cx="306" cy="62" r="22" fill="#ffe7a8" opacity=".25" filter="url(#brillo)"/>
  </g>

  <!-- Regalos con lazos de seda -->
  <g>
    <rect x="70" y="474" width="120" height="96" rx="4" fill="url(#vino)"/>
    <rect x="62" y="456" width="136" height="26" rx="3" fill="#a3243a"/>
    <rect x="122" y="456" width="16" height="114" fill="url(#oro)"/>
    <path d="M130 456 C100 420 76 440 94 454 C104 462 120 458 130 456 Z M130 456 C160 420 184 440 166 454 C156 462 140 458 130 456 Z" fill="url(#oro)"/>
    <rect x="200" y="512" width="86" height="58" rx="4" fill="url(#esmeralda)"/>
    <rect x="194" y="500" width="98" height="18" rx="3" fill="#238a61"/>
    <rect x="236" y="500" width="12" height="70" fill="url(#oro)"/>
    <path d="M242 500 C222 476 206 490 218 500 C226 506 236 503 242 500 Z M242 500 C262 476 278 490 266 500 C258 506 248 503 242 500 Z" fill="url(#oro)"/>
    <rect x="410" y="498" width="104" height="72" rx="4" fill="#f4ecd8"/>
    <rect x="404" y="484" width="116" height="20" rx="3" fill="#fbf6e9"/>
    <rect x="454" y="484" width="14" height="86" fill="url(#vino)"/>
    <path d="M461 484 C438 456 420 472 434 484 C443 491 454 487 461 484 Z M461 484 C484 456 502 472 488 484 C479 491 468 487 461 484 Z" fill="url(#vino)"/>
  </g>
  <rect x="20" y="570" width="520" height="4" rx="2" fill="url(#oro)" opacity=".55"/>
</svg>
