# TEMPORAL: verificar la vista previa del PR #134 (solo lectura; sin estadísticas). Se elimina después.
name: tmp noticia CRA vista previa
on:
  push:
    branches: [claude/noticia-cra-recien-llegados-vista]
permissions:
  contents: write
jobs:
  verificar:
    runs-on: ubuntu-latest
    env:
      P: https://claude-noticia-cra-recien-ll.podcastdelmigrante.pages.dev
      S: recien-llegados-canada-beneficios-cra-cgeb-ccb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Esperar la vista previa (máx. 15 min)
        run: |
          v=$(grep -o 'js/data.js?v=[0-9a-f]*' index.html)
          for i in $(seq 90); do
            curl -fsS "$P/?nc=$i$RANDOM" | grep -q "$v" && { echo "lista (intento $i)"; exit 0; }
            sleep 10
          done; exit 1
      - name: HTML que leen WhatsApp y Facebook (sin JavaScript)
        if: always()
        run: |
          mkdir -p /tmp/out
          { for u in "/articulo-$S" "/assets/social/$S.jpg" "/assets/$S.jpg"; do curl -s -o /dev/null -w "%{http_code} %{content_type} $u\n" "$P$u"; done
            curl -s -A "facebookexternalhit/1.1" "$P/articulo-$S" | grep -oE '<title>[^<]*</title>|<meta (property|name)="(og|twitter):[^"]*" content="[^"]*"|rel="canonical" href="[^"]*"|"@type":"NewsArticle"'
            curl -s "$P/articulo-$S" | grep -oE 'href="https://www\.canada\.ca/[^"]*(rc151|rc66)\.html"' | sort | uniq -c
          } | tee /tmp/out/html.txt
      - run: cd /tmp && mkdir -p pw && cd pw && npm init -y >/dev/null && npm i -s playwright && npx playwright install --with-deps chromium >/dev/null
      - name: E2E (iPhone SE, iPhone 13, iPhone 14 Pro Max, tableta, computador)
        if: always()
        run: |
          r=0
          for t in cra-recien-llegados ultimas-noticias-movil noticias noticias-html fundador-portada menu; do
            BASE=$P SHOTS=/tmp/out NODE_PATH=/tmp/pw/node_modules NODE_OPTIONS="--require $PWD/tmp-prod/sin-estadisticas.cjs" node tests/e2e-$t.cjs 2>&1 | grep -v "^\s*at " | tail -10 | tee /tmp/out/e2e-$t.txt; [ ${PIPESTATUS[0]} = 0 ] || r=1
          done; exit $r
      - name: Publicar
        if: always()
        run: |
          cd /tmp/out && git init -q -b datos && git config user.name datos && git config user.email datos@users.noreply.github.com && git add -A && git commit -qm "vista previa noticia CRA [CF-Pages-Skip]"
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" datos:refs/heads/claude/noticia-cra-recien-llegados-vista-datos-${{ github.run_number }}
