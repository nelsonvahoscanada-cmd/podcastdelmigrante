# TEMPORAL: comprobación de solo lectura en producción. Se elimina después de usarse.
name: alberta-produccion
on:
  push:
    branches: [claude/alberta-localidades]
    paths: [.github/workflows/alberta-produccion.yml]
permissions:
  contents: read
jobs:
  produccion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rutas, metadatos y fichas
        run: |
          B=https://podcastdelmigrante.com
          for p in calgary edmonton brooks red-deer lethbridge medicine-hat acme county-of-newell strathcona-county special-areas-2 regional-municipality-of-wood-buffalo; do
            curl -sS -o /tmp/p.html -w "%{http_code} /canada-en-datos/alberta/$p | " "$B/canada-en-datos/alberta/$p"
            echo "$(grep -o '<title>[^<]*' /tmp/p.html | head -1 | cut -c8-) | robots: $(grep -c 'noindex' /tmp/p.html) | canonical: $(grep -o 'rel="canonical" href="[^"]*' /tmp/p.html | cut -d'"' -f4)"
          done
          for p in / /canada-en-datos/ /canada-en-datos/alberta /noticias /perfil-carlos-d-castillo /perfil-tomas-velazquez /articulo-referendum-alberta-octubre-2026-inmigrantes /js/alberta-localidades.js /assets/canada-en-datos/alberta-regiones.svg /canada-en-datos/alberta/no-existe; do
            curl -sS -o /dev/null -w "%{http_code} $p\n" "$B$p"
          done
          curl -sS $B/sitemap.xml | grep -c "canada-en-datos/alberta/"
          curl -sS -o /dev/null -w "admin %{http_code}\n" https://admin.podcastdelmigrante.com/
      - name: Navegador contra producción (computador, tableta y celular)
        run: |
          npm i --no-save playwright@1.48.2 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          BASE=https://podcastdelmigrante.com node tests/e2e-alberta-localidades.cjs
          BASE=https://podcastdelmigrante.com node tests/e2e-canada-datos.cjs
          BASE=https://podcastdelmigrante.com node tests/e2e-noticias.cjs
