# TEMPORAL: verificar fuentes oficiales y el enlace de TikTok (solo lectura). Se elimina después.
name: fuentes-alquiler
on:
  push:
    branches: [claude/laughing-albattani-1rvkc1-alquiler-fuentes]
permissions:
  contents: read
jobs:
  fuentes:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Safari/537.36'
          echo "== TikTok"; curl -s -o /dev/null -A "$UA" -L -w 'final: %{url_effective} (%{http_code})\n' https://vt.tiktok.com/ZSpSKd9gG/
          curl -s -I -A "$UA" https://vt.tiktok.com/ZSpSKd9gG/ | grep -i '^location' | head -2
          for u in https://findhousing.alberta.ca/ https://www.alberta.ca/rent-assistance; do curl -s -o /dev/null -A "$UA" -L -w "$u: %{http_code}\n" "$u"; done
          curl -s -A "$UA" -L https://www.alberta.ca/rent-assistance > ra.html
          python3 - <<'PY'
          import re,html
          t=open('ra.html',encoding='utf-8',errors='ignore').read()
          t=re.sub(r'(?is)<(script|style|nav|footer|header).*?</\1>',' ',t); t=html.unescape(re.sub(r'<[^>]+>','\n',t))
          lines=[l.strip() for l in t.splitlines() if l.strip()]
          print("\n".join(lines[:400]))
          PY
