name: tmp nunavut correcciones produccion
on:
  push:
    branches: [claude/laughing-albattani-1rvkc1-nunavut-corr-prod]
    paths: [".github/workflows/tmp-nunavut-corr-prod.yml"]
permissions:
  contents: write
jobs:
  produccion:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Esperar el despliegue
        run: for i in $(seq 1 60); do curl -sL https://podcastdelmigrante.com/js/canada-datos.js | grep -q cpiIqaluit && curl -sL https://podcastdelmigrante.com/canada-en-datos/nunavut | grep -q 'Seguridad y emergencias' && echo listo && exit 0; sleep 20; done; exit 1
      - run: mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.48.0 >/dev/null && npx playwright install --with-deps chromium >/dev/null
      - name: Simulador del contador (no genera visitas)
        run: |
          cat > /tmp/pw/vistas.cjs <<'JS'
          const pw = require("/tmp/pw/node_modules/playwright");
          const orig = pw.chromium.launch.bind(pw.chromium);
          pw.chromium.launch = async (...a) => {
            const b = await orig(...a);
            const nc = b.newContext.bind(b);
            b.newContext = async (...o) => { const c = await nc(...o); await c.route(/\/api\/(vistas|events)/, (r) => r.fulfill({ status: 200, contentType: "application/json", body: '{"ok":true,"vistas":0}' })); return c; };
            b.newPage = async (...o) => { const c = await b.newContext(...o); return c.newPage(); };
            return b;
          };
          JS
      - name: Archivos y rutas
        continue-on-error: true
        run: |
          mkdir -p /tmp/out; B=https://podcastdelmigrante.com
          { igual=0; dist=0
            for f in js/canada-datos.js js/canada-directorio.js js/canada-region.js js/nunavut-localidades.js js/canada-datos-disponibles.js css/canada-datos.css sitemap.xml assets/canada-en-datos/bandera-nunavut.svg assets/canada-en-datos/nunavut-regiones.svg assets/canada-en-datos/social-nunavut.jpg assets/canada-en-datos/nunavut/*.jpg; do
              curl -sfL "$B/$f" -o /tmp/x; if cmp -s /tmp/x "$f"; then igual=$((igual+1)); else dist=$((dist+1)); echo "DISTINTO $f"; fi; done
            echo "archivos idénticos: $igual, distintos: $dist"
            ok=0; mal=0
            for f in canada-en-datos/nunavut.html canada-en-datos/nunavut/*.html canada-en-datos/index.html canada-en-datos/alberta.html canada-en-datos/quebec.html; do
              r="/${f%.html}"; [ "$r" = "/canada-en-datos/index" ] && r="/canada-en-datos/"
              c=$(curl -s -o /tmp/p -w '%{http_code}' "$B$r")
              if [ "$c" = 200 ] && grep -q '<link rel="canonical"' /tmp/p; then ok=$((ok+1)); else mal=$((mal+1)); echo "MAL $c $r"; fi
            done
            echo "páginas 200: $ok, con problemas: $mal"
            for r in /canada-en-datos/nunavut /canada-en-datos/nunavut/iqaluit /canada-en-datos/nunavut/kinngait /canada-en-datos/alberta /; do
              curl -s -D h.txt -o /tmp/p "$B$r"; echo "$r → $(head -1 h.txt | tr -d '\r') | <title>$(grep -o '<title>[^<]*' /tmp/p | cut -c8-) | noindex=$(grep -c 'content="noindex"' /tmp/p)"; done
          } | tee /tmp/out/archivos.txt
      - name: E2E en produccion (solo lectura)
        env:
          BASE: https://podcastdelmigrante.com
          NODE_PATH: /tmp/pw/node_modules
          NODE_OPTIONS: --require /tmp/pw/vistas.cjs
        run: |
          set +e; mkdir -p /tmp/out/shots
          for t in nunavut-localidades canada-datos alberta-localidades quebec-localidades descubre-canada; do
            if [ $t = nunavut-localidades ]; then export SHOTS=/tmp/out/shots; else unset SHOTS; fi
            node tests/e2e-$t.cjs > /tmp/out/$t.log 2>&1; e=$?
            if [ $e != 0 ]; then mv /tmp/out/$t.log /tmp/out/$t-intento1.log; node tests/e2e-$t.cjs > /tmp/out/$t.log 2>&1; e=$?; fi
            echo "exit $e $t" | tee -a /tmp/out/resultado.txt; tail -5 /tmp/out/$t.log
          done
      - name: Publicar
        if: always()
        run: |
          cd /tmp/out && git init -q -b datos && git config user.name datos && git config user.email datos@users.noreply.github.com && git add -A && git commit -qm "Verificacion correcciones nunavut [CF-Pages-Skip]"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" datos:refs/heads/claude/laughing-albattani-1rvkc1-nunavut-corr-prod-datos
