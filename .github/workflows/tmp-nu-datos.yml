name: tmp nunavut datos
on:
  push:
    branches: [claude/laughing-albattani-1rvkc1-nu-run]
    paths: [".github/workflows/tmp-nu-datos.yml"]
permissions:
  contents: write
jobs:
  datos:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q pyproj shapely openpyxl playwright && python -m playwright install --with-deps chromium >/dev/null
      - name: Ronda 2
        continue-on-error: true
        run: |
          mkdir -p /tmp/out
          for p in archivo statcan clima paginas; do python scripts/canada-en-datos/obtener-nu-ficha2.py $p > /tmp/out/r2-$p.log 2>&1; tail -2 /tmp/out/r2-$p.log; done
      - name: Publicar
        if: always()
        run: |
          cd /tmp/out && git init -q -b datos && git config user.name datos && git config user.email datos@users.noreply.github.com && git add -A && git commit -qm "datos Nunavut ronda 2 [CF-Pages-Skip]"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" datos:refs/heads/claude/laughing-albattani-1rvkc1-nu-datos2
