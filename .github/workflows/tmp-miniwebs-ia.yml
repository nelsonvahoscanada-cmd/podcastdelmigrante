# TEMPORAL: auditoría de solo lectura de las miniwebs Premium ante rastreadores. Se elimina después.
name: tmp miniwebs ia
on:
  push:
    branches: [claude/miniwebs-ia-auditoria]
permissions:
  contents: write
jobs:
  auditar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p /tmp/out && python3 tmp-audit/miniwebs-ia.py
      - name: Publicar
        if: always()
        run: |
          cd /tmp/out && git init -q -b datos && git config user.name datos && git config user.email datos@users.noreply.github.com && git add -A && git commit -qm "auditoria [CF-Pages-Skip]"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" datos:refs/heads/claude/miniwebs-ia-auditoria-datos
