# TEMPORAL: verificar en producción el PR #139 (solo lectura; sin estadísticas). Se elimina después.
name: tmp ns prod
on:
  push:
    branches: [claude/canada-datos-ns-prod]
permissions:
  contents: write
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      P: https://podcastdelmigrante.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Detalle de la línea PDM_SITE_ROOT_LINKS (solo GET)
        if: always()
        run: |
          mkdir -p /tmp/out; o=/tmp/out/detalle.txt
          for u in /canada-en-datos/quebec/abercorn /canada-en-datos/nova-scotia/halifax /canada-en-datos/alberta /index.html; do
            curl -sS -D /tmp/hdr "$P$u?nc=$RANDOM" -o /tmp/h
            echo "### $u | apariciones: $(grep -c PDM_SITE_ROOT_LINKS /tmp/h) | cf-cache: $(grep -i '^cf-cache-status' /tmp/hdr | tr -d '\r')" >> $o
            grep -n -o '.\{0,80\}PDM_SITE_ROOT_LINKS.\{0,80\}' /tmp/h | head -3 >> $o
          done
          cat $o
      - run: mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i -s playwright && npx playwright install --with-deps chromium >/dev/null
      - name: E2E general de Canadá en Datos sin capturas (estadísticas bloqueadas)
        if: always()
        run: |
          BASE=$P NODE_PATH=/tmp/pw/node_modules NODE_OPTIONS="--require $PWD/tmp-prod/sin-estadisticas.cjs" node tests/e2e-canada-datos.cjs 2>&1 | grep -v "^\s*at " | tail -30 | tee /tmp/out/e2e-canada-datos.txt
      - name: Publicar
        if: always()
        run: |
          cd /tmp/out && git init -q -b datos && git config user.name datos && git config user.email datos@users.noreply.github.com && git add -A && git commit -qm "producción Nueva Escocia [CF-Pages-Skip]"
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" datos:refs/heads/claude/canada-datos-ns-prod-datos-${{ github.run_number }}
