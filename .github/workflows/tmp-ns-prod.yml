# TEMPORAL: verificar en producción el PR #139 (solo lectura; sin estadísticas). Se elimina después.
name: tmp ns prod
on:
  push:
    branches: [claude/canada-datos-ns-prod]
permissions:
  contents: write
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      P: https://podcastdelmigrante.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Esperar el despliegue en producción (máx. 20 min)
        run: |
          for i in $(seq 120); do
            curl -fsS "$P/canada-en-datos/nova-scotia?nc=$i$RANDOM" | grep -q 'Explora las ciudades y pueblos de Nueva Escocia' && { echo "desplegado (intento $i)"; exit 0; }
            sleep 10
          done; exit 1
      - name: Páginas servidas frente al repositorio (solo GET)
        if: always()
        run: |
          mkdir -p /tmp/out; o=/tmp/out/paginas.txt
          norm() { grep -v -e 'email-decode' -e 'email-protection' -e 'js/data.js' -e 'mailto:' "$1"; }
          ok=0; dif=0; err=0
          for h in $(ls canada-en-datos/*.html) $(ls canada-en-datos/nova-scotia/*.html) $(for d in canada-en-datos/*/; do ls $d*.html | head -3; done | grep -v nova-scotia); do
            u=/${h%.html}; [ "$u" = "/canada-en-datos/index" ] && u=/canada-en-datos/
            if ! curl -fsS "$P$u?nc=$RANDOM" -o /tmp/h; then echo "ERROR $u" >> $o; err=$((err+1)); continue; fi
            if diff -q <(norm "$h") <(norm /tmp/h) >/dev/null; then ok=$((ok+1)); else echo "DISTINTA $u" >> $o; diff <(norm "$h") <(norm /tmp/h) | head -6 >> $o; dif=$((dif+1)); fi
          done
          echo "idénticas: $ok | distintas: $dif | errores: $err" | tee -a $o
          for f in sitemap.xml js/canada-datos.js js/canada-datos-disponibles.js js/nova-scotia-localidades.js assets/canada-en-datos/descubre-mapa.svg assets/canada-en-datos/nova-scotia-regiones.svg assets/canada-en-datos/bandera-nova-scotia.svg assets/canada-en-datos/social-nova-scotia.jpg assets/canada-en-datos/nova-scotia/halifax.jpg assets/canada-en-datos/nova-scotia/dartmouth.jpg; do
            curl -fsS "$P/$f?nc=$RANDOM" -o /tmp/f && cmp -s /tmp/f "$f" && echo "igual $f" || echo "DISTINTO $f"
          done >> $o
          echo "sitemap URL de Nueva Escocia: $(curl -s $P/sitemap.xml | grep -c 'canada-en-datos/nova-scotia')" >> $o
          echo "GET /api/events: $(curl -s -o /dev/null -w '%{http_code}' $P/api/events)" >> $o
          cat $o | tail -40
      - run: mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i -s playwright && npx playwright install --with-deps chromium >/dev/null
      - name: E2E en producción (estadísticas bloqueadas)
        if: always()
        run: |
          r=0
          for t in nova-scotia-localidades new-brunswick-localidades descubre-canada canada-datos; do
            BASE=$P SHOTS=/tmp/out NODE_PATH=/tmp/pw/node_modules NODE_OPTIONS="--require $PWD/tmp-prod/sin-estadisticas.cjs" node tests/e2e-$t.cjs 2>&1 | grep -v "^\s*at " | tail -30 | tee /tmp/out/e2e-$t.txt; [ ${PIPESTATUS[0]} = 0 ] || r=1
          done; exit $r
      - name: Publicar
        if: always()
        run: |
          cd /tmp/out && git init -q -b datos && git config user.name datos && git config user.email datos@users.noreply.github.com && git add -A && git commit -qm "producción Nueva Escocia [CF-Pages-Skip]"
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" datos:refs/heads/claude/canada-datos-ns-prod-datos-${{ github.run_number }}
