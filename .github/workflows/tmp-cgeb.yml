name: tmp cgeb fuentes
on:
  push:
    branches: [claude/laughing-albattani-1rvkc1-cgeb]
    paths: [".github/workflows/tmp-cgeb.yml"]
permissions:
  contents: write
jobs:
  fuentes:
    runs-on: ubuntu-latest
    steps:
      - name: Enlaces oficiales (solo lectura)
        run: |
          mkdir -p /tmp/out; cd /tmp/out
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Safari/537.36"
          B=https://www.canada.ca/en/revenue-agency/services
          for u in $B/child-family-benefits/canada-groceries-essentials-benefit.html $B/child-family-benefits/canada-groceries-essentials-benefit/get-benefit.html $B/child-family-benefits/canada-groceries-essentials-benefit/who-eligible.html $B/child-family-benefits/canada-groceries-essentials-benefit/how-much.html $B/child-family-benefits/canada-groceries-essentials-benefit/how-much/payments-chart.html $B/child-family-benefits/canada-groceries-essentials-benefit/payment-dates.html $B/e-services/cra-login-services.html $B/forms-publications/forms/rc151.html; do
            echo "$(curl -sL --max-time 60 -A "$UA" -o /tmp/x.html -w '%{http_code} %{url_effective}' "$u") | $(grep -o '<title>[^<]*' /tmp/x.html | head -1)"
          done | tee enlaces.txt
          curl -sL --max-time 60 -A "$UA" "$B/child-family-benefits/canada-groceries-essentials-benefit/get-benefit.html" | grep -o -i 'href="[^"]*\(rc151\|login\|my-account\|cra-account\)[^"]*"' | sort -u | tee -a enlaces.txt
      - name: Publicar en la rama de datos
        run: |
          cd /tmp/out && git init -q -b datos && git config user.name "datos" && git config user.email "datos@users.noreply.github.com"
          git add -A && git commit -qm "Enlaces CGEB [CF-Pages-Skip]"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" datos:refs/heads/claude/laughing-albattani-1rvkc1-cgeb-datos
