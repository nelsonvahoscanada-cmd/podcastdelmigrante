name: tmp SK
on:
  push:
    branches: [claude/laughing-albattani-1rvkc1-saskatchewan]
    paths: [".github/workflows/tmp-sk.yml", "scripts/canada-en-datos/obtener-sk-ficha5.py"]
permissions:
  contents: read
jobs:
  ficha5:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        parte: [ciudades, hora]
    steps:
      - uses: actions/checkout@v4
      - run: pip install playwright==1.48.0 pypdf==5.1.0 && python3 -m playwright install --with-deps chromium
      - run: python3 scripts/canada-en-datos/obtener-sk-ficha5.py ${{ matrix.parte }}
