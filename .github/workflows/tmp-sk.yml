name: tmp SK
on:
  push:
    branches: [claude/laughing-albattani-1rvkc1-saskatchewan]
    paths: [".github/workflows/tmp-sk.yml", "scripts/canada-en-datos/obtener-sk-enlaces.py", "scripts/canada-en-datos/sk-enlaces.txt"]
permissions:
  contents: read
jobs:
  enlaces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install playwright==1.48.0 && python3 -m playwright install --with-deps chromium
      - run: python3 scripts/canada-en-datos/obtener-sk-enlaces.py
