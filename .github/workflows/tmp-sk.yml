name: tmp SK
on:
  push:
    branches: [claude/laughing-albattani-1rvkc1-saskatchewan]
    paths: [".github/workflows/tmp-sk.yml", "scripts/canada-en-datos/obtener-sk*.py"]
permissions:
  contents: read
jobs:
  localidades:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install openpyxl==3.1.5 pyproj==3.7.1 shapely==2.0.7
      - run: python3 scripts/canada-en-datos/obtener-sk-localidades.py
  ficha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install playwright==1.48.0 && python3 -m playwright install --with-deps chromium
      - run: python3 scripts/canada-en-datos/obtener-sk-ficha.py statcan
        continue-on-error: true
      - run: python3 scripts/canada-en-datos/obtener-sk-ficha.py paginas
        continue-on-error: true
      - run: python3 scripts/canada-en-datos/obtener-sk-ficha.py salario
        continue-on-error: true
