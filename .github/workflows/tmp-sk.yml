name: tmp SK
on:
  push:
    branches: [claude/laughing-albattani-1rvkc1-saskatchewan]
    paths: [".github/workflows/tmp-sk.yml", "scripts/canada-en-datos/obtener-sk*.py"]
permissions:
  contents: read
jobs:
  ficha3:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        parte: [paginas, hora, censo, dic]
    steps:
      - uses: actions/checkout@v4
      - if: matrix.parte == 'paginas' || matrix.parte == 'dic'
        run: pip install playwright==1.48.0 && python3 -m playwright install --with-deps chromium
      - run: python3 scripts/canada-en-datos/obtener-sk-ficha3.py ${{ matrix.parte }}
