# TEMPORAL: verificar la vista previa del PR #130 (solo lectura; sin estadísticas). Se elimina después.
name: tmp css version vista previa
on:
  push:
    branches: [claude/fundador-css-version-vista]
permissions:
  contents: write
jobs:
  verificar:
    runs-on: ubuntu-latest
    env:
      P: https://claude-fundador-css-version.podcastdelmigrante.pages.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Esperar la vista previa con la hoja versionada (máx. 15 min)
        run: |
          for i in $(seq 90); do
            curl -fsS "$P/?nc=$i$RANDOM" | grep -q 'href="css/styles.css?v=' && { echo "vista previa lista (intento $i)"; exit 0; }
            sleep 10
          done; exit 1
      - run: mkdir -p /tmp/out /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i -s playwright && npx playwright install --with-deps chromium >/dev/null
      - name: Hoja versionada en la vista previa
        if: always()
        run: |
          h=$(curl -s "$P/" | grep -o 'css/styles.css?v=[0-9a-f]*'); echo "portada → $h" | tee /tmp/out/estados.txt
          curl -sI "$P/$h" | grep -i -E "^(HTTP|cache-control|content-type)" | tee -a /tmp/out/estados.txt
          echo "huella: $(curl -s "$P/$h" | sha256sum | cut -c1-10) · repositorio: $(sha256sum < css/styles.css | cut -c1-10)" | tee -a /tmp/out/estados.txt
      - name: E2E (tarjeta con y sin la hoja anterior en caché; 5 dispositivos)
        if: always()
        run: |
          r=0
          for t in fundador-portada menu noticias; do
            BASE=$P SHOTS=/tmp/out NODE_PATH=/tmp/pw/node_modules NODE_OPTIONS="--require $PWD/tmp-prod/sin-estadisticas.cjs" node tests/e2e-$t.cjs 2>&1 | grep -v "^\s*at " | tail -12 | tee /tmp/out/e2e-$t.txt; [ ${PIPESTATUS[0]} = 0 ] || r=1
          done; exit $r
      - name: Publicar
        if: always()
        run: |
          cd /tmp/out && git init -q -b datos && git config user.name datos && git config user.email datos@users.noreply.github.com && git add -A && git commit -qm "vista previa css version [CF-Pages-Skip]"
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" datos:refs/heads/claude/fundador-css-version-vista-datos-${{ github.run_number }}
