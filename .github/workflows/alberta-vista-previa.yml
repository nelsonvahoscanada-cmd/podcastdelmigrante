# TEMPORAL: prueba de solo lectura de la vista previa de la rama. Se elimina después de usarse.
name: alberta-vista-previa
on:
  push:
    branches: [claude/alberta-localidades]
    paths: [.github/workflows/alberta-vista-previa.yml]
permissions:
  contents: read
jobs:
  vista-previa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for p in /canada-en-datos/alberta /canada-en-datos/alberta/ /canada-en-datos/alberta/brooks /canada-en-datos/alberta/acme /canada-en-datos/alberta/no-existe /js/alberta-localidades.js; do
            curl -sS -o /dev/null -w "%{http_code} %{redirect_url} $p\n" "https://claude-alberta-localidades.podcastdelmigrante.pages.dev$p"
          done
      - run: |
          npm i --no-save playwright@1.48.2 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          BASE=https://claude-alberta-localidades.podcastdelmigrante.pages.dev node tests/e2e-alberta-localidades.cjs
          BASE=https://claude-alberta-localidades.podcastdelmigrante.pages.dev node tests/e2e-canada-datos.cjs
