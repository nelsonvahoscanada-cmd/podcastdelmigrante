name: tmp SK produccion
on:
  push:
    branches: [claude/laughing-albattani-1rvkc1-saskatchewan]
    paths: [".github/workflows/tmp-sk-prod.yml"]
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        prueba: [e2e-saskatchewan-localidades, e2e-canada-datos, e2e-alberta-localidades, e2e-ontario-localidades, e2e-british-columbia-localidades, e2e-prince-edward-island-localidades, e2e-menu]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.48.0 >/dev/null && npx playwright install --with-deps chromium >/dev/null
      - name: Simulador del contador (solo lectura; no genera visitas en producción)
        run: |
          cat > /tmp/pw/vistas.cjs <<'JS'
          const pw = require("/tmp/pw/node_modules/playwright");
          const orig = pw.chromium.launch.bind(pw.chromium);
          pw.chromium.launch = async (...a) => {
            const b = await orig(...a);
            const nc = b.newContext.bind(b);
            b.newContext = async (...o) => { const c = await nc(...o); await c.route(/\/api\/(vistas|events)/, (r) => r.fulfill({ status: 200, contentType: "application/json", body: '{"ok":true,"vistas":0}' })); return c; };
            const np = b.newPage.bind(b);
            b.newPage = async (...o) => { const c = await b.newContext(...o); return c.newPage(); };
            return b;
          };
          JS
      - run: node tests/${{ matrix.prueba }}.cjs
        env:
          BASE: https://podcastdelmigrante.com
          NODE_PATH: /tmp/pw/node_modules
          NODE_OPTIONS: --require /tmp/pw/vistas.cjs
  sitio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archivos publicados idénticos a main y rutas principales
        run: |
          set -e
          B=https://podcastdelmigrante.com
          for f in css/canada-datos.css js/canada-datos.js js/saskatchewan-localidades.js js/canada-directorio.js js/directorio/solicitud-form.js; do
            curl -sf "$B/$f" -o /tmp/x; if cmp -s /tmp/x "$f"; then echo "IGUAL $f"; else echo "DISTINTO $f"; fi
          done
          for r in /canada-en-datos/ /canada-en-datos/saskatchewan /canada-en-datos/saskatchewan/regina /canada-en-datos/saskatchewan/lloydminster /canada-en-datos/saskatchewan/division-no-18-unorganized /canada-en-datos/alberta /canada-en-datos/ontario /canada-en-datos/british-columbia /canada-en-datos/prince-edward-island / /registra-tu-empresa.html /noticias.html /assets/canada-en-datos/social-saskatchewan.jpg; do
            echo "$(curl -s -o /dev/null -w '%{http_code}' "$B$r") $r"
          done
          curl -s "$B/canada-en-datos/" | grep -o 'class="cd-region cd-region--ficha" data-code="[A-Z]*"' | sort
          curl -s "$B/canada-en-datos/saskatchewan" | grep -o '<meta property="og:[a-z:]*" content="[^"]*"' 
          curl -s "$B/sitemap.xml" | grep -c "canada-en-datos/saskatchewan"
          echo "páginas de SK con 200 (muestra de 60):"
          ls canada-en-datos/saskatchewan | shuf -n 60 --random-source=<(yes) | while read f; do curl -s -o /dev/null -w '%{http_code}\n' "$B/canada-en-datos/saskatchewan/${f%.html}"; done | sort | uniq -c
          echo "fichas completas:"
          for s in regina saskatoon prince-albert moose-jaw swift-current yorkton north-battleford lloydminster; do curl -s "$B/canada-en-datos/saskatchewan/$s" | grep -c 'name="robots"' | sed "s/^/$s noindex=/"; done
          grep -c "f2c230" css/canada-datos.css || echo "sin dorado en el CSS"
