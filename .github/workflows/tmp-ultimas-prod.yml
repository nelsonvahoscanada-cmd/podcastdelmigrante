# TEMPORAL: verificar en producción el PR #133 (solo lectura; sin estadísticas). Se elimina después.
name: tmp ultimas noticias prod
on:
  push:
    branches: [claude/ultimas-noticias-movil-prod]
permissions:
  contents: write
jobs:
  verificar:
    runs-on: ubuntu-latest
    env:
      P: https://podcastdelmigrante.com
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 3 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Esperar el despliegue en producción (máx. 20 min)
        run: |
          v=$(grep -o 'css/styles.css?v=[0-9a-f]*' index.html)
          for i in $(seq 120); do
            curl -fsS "$P/?nc=$i$RANDOM" | grep -q "$v" && { echo "desplegado (intento $i): $v"; exit 0; }
            sleep 10
          done; exit 1
      - run: mkdir -p /tmp/out /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i -s playwright && npx playwright install --with-deps chromium >/dev/null
      - name: Alcance del cambio y estados HTTP
        if: always()
        run: |
          git diff --stat HEAD~2 HEAD~1 | tee /tmp/out/estados.txt
          for u in / /noticias /articulo-canada-33000-residencias-permanentes-trabajadores-2026 /magazine/ /desafio-100-empresas/ /quien-puede-ayudarte /planes-directorio /perfil-nelson-vahos /perfil-santa-latino /canada-en-datos/; do printf "%-70s %s\n" "$u" "$(curl -s -o /dev/null -w '%{http_code}' "$P$u")"; done | tee -a /tmp/out/estados.txt
          echo "styles.css servida = repositorio: $(curl -s "$P/$(grep -o 'css/styles.css?v=[0-9a-f]*' index.html)" | cmp -s - css/styles.css && echo sí || echo NO)" | tee -a /tmp/out/estados.txt
      - name: E2E en producción (estadísticas bloqueadas)
        if: always()
        run: |
          r=0
          for t in ultimas-noticias-movil noticias fundador-portada menu santa-latino nelson-vahos seo-redirecciones; do
            BASE=$P SHOTS=/tmp/out NODE_PATH=/tmp/pw/node_modules NODE_OPTIONS="--require $PWD/tmp-prod/sin-estadisticas.cjs" node tests/e2e-$t.cjs 2>&1 | grep -v "^\s*at " | tail -10 | tee /tmp/out/e2e-$t.txt; [ ${PIPESTATUS[0]} = 0 ] || r=1
          done; exit $r
      - name: Publicar
        if: always()
        run: |
          cd /tmp/out && git init -q -b datos && git config user.name datos && git config user.email datos@users.noreply.github.com && git add -A && git commit -qm "prod ultimas noticias [CF-Pages-Skip]"
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" datos:refs/heads/claude/ultimas-noticias-movil-prod-datos-${{ github.run_number }}
