name: tmp qc datos
on:
  push:
    branches: [claude/laughing-albattani-1rvkc1-quebec]
    paths: [".github/workflows/tmp-qc-datos.yml"]
permissions:
  contents: write
jobs:
  datos:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q playwright && python -m playwright install --with-deps chromium >/dev/null
      - name: Segundo intento, uno por uno, de los enlaces que fallaron
        continue-on-error: true
        run: mkdir -p /tmp/out && cd scripts/canada-en-datos && python3 obtener-enlaces.py qc-enlaces-reintento.txt > /tmp/out/enlaces-reintento.log 2>&1; tail -3 /tmp/out/enlaces-reintento.log
      - name: Publicar en la rama de datos
        run: |
          cd /tmp/out && git init -q -b datos && git config user.name "datos" && git config user.email "datos@users.noreply.github.com"
          git add -A && git commit -qm "Enlaces de Quebec (solo lectura) [CF-Pages-Skip]"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" datos:refs/heads/claude/laughing-albattani-1rvkc1-qc-enlaces2
