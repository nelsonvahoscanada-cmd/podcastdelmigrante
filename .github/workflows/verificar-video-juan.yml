    runs-on: ubuntu-latest
    steps:
      - run: |
          V=9rg27W1igsY
          curl -s -w '\noembed: %{http_code}\n' "https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=$V&format=json"
