# TEMPORAL: verificar la vista previa del PR #127 (solo lectura; sin estadísticas). Se elimina después.
name: tmp nelson vista previa
on:
  push:
    branches: [claude/miniweb-nelson-vahos-vista]
permissions:
  contents: write
jobs:
  verificar:
    runs-on: ubuntu-latest
    env:
      P: https://claude-miniweb-nelson-vahos.podcastdelmigrante.pages.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: mkdir -p /tmp/out /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i -s playwright && npx playwright install --with-deps chromium >/dev/null
      - name: Estados HTTP en la vista previa
        if: always()
        run: |
          for u in "/perfil-nelson-vahos" "/perfil-nelson-vahos.html" "/business-profile?slug=nelson-vahos" "/vcard/nelson-vahos.vcf" "/assets/qr/perfil-nelson-vahos.png" "/assets/qr/contacto-nelson-vahos.png" "/assets/directorio/perfiles/nelson-vahos.jpg" "/assets/directorio/perfiles/nelson-vahos-og.jpg" "/css/temas/institucional.css" "/negocios-premium.json" "/desafio-100-empresas/" "/perfil-tomas-velazquez" "/perfil-carlos-d-castillo" "/perfil-santa-latino" "/perfil-1juanromero1" "/quien-puede-ayudarte" "/planes-directorio"; do
            printf "%-50s %s\n" "$u" "$(curl -s -o /tmp/b -w '%{http_code} %{redirect_url}' "$P$u") $(grep -o '<title>[^<]*' /tmp/b | head -1 | cut -c8-80)"
          done | tee /tmp/out/estados.txt
          curl -s "$P/robots.txt" | head -5 | tee -a /tmp/out/estados.txt
          curl -sI "$P/perfil-nelson-vahos" | grep -i "x-robots-tag" | tee -a /tmp/out/estados.txt || true
      - name: E2E miniweb Nelson Vahos (computador, tableta, celular; sin y con JavaScript)
        if: always()
        run: BASE=$P SHOTS=/tmp/out NODE_PATH=/tmp/pw/node_modules NODE_OPTIONS="--require $PWD/tmp-prod/sin-estadisticas.cjs" node tests/e2e-nelson-vahos.cjs 2>&1 | tee /tmp/out/e2e-nelson.txt; exit ${PIPESTATUS[0]}
      - name: E2E miniwebs existentes y directorio
        if: always()
        run: |
          r=0
          for t in santa-latino 1juanromero1 planes-directorio; do
            BASE=$P NODE_PATH=/tmp/pw/node_modules NODE_OPTIONS="--require $PWD/tmp-prod/sin-estadisticas.cjs" node tests/e2e-$t.cjs 2>&1 | tail -5 | tee /tmp/out/e2e-$t.txt; [ ${PIPESTATUS[0]} = 0 ] || r=1
          done; exit $r
      - name: Publicar
        if: always()
        run: |
          cd /tmp/out && git init -q -b datos && git config user.name datos && git config user.email datos@users.noreply.github.com && git add -A && git commit -qm "vista previa nelson [CF-Pages-Skip]"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" datos:refs/heads/claude/miniweb-nelson-vahos-vista-datos
