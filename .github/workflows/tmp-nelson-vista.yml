# TEMPORAL: verificar la vista previa del PR #127 (solo lectura; sin estadísticas). Se elimina después.
name: tmp nelson vista previa
on:
  push:
    branches: [claude/miniweb-nelson-vahos-vista]
permissions:
  contents: write
jobs:
  verificar:
    runs-on: ubuntu-latest
    env:
      P: https://claude-miniweb-nelson-vahos.podcastdelmigrante.pages.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Esperar la vista previa con WhatsApp, llamada y TikTok (máx. 15 min)
        run: |
          for i in $(seq 90); do
            curl -fsS "$P/perfil-nelson-vahos?nc=$i$RANDOM" | grep -q "Patrocinios, publicidad y alianzas para llegar" && curl -fsS "$P/publicidad?nc=$i$RANDOM" | grep -q 'href="/perfil-nelson-vahos"'  && { echo "vista previa actualizada (intento $i)"; exit 0; }
            sleep 10
          done; exit 1
      - run: mkdir -p /tmp/out /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i -s playwright && npx playwright install --with-deps chromium >/dev/null
      - name: Estados HTTP y vCard en la vista previa
        if: always()
        run: |
          for u in "/perfil-nelson-vahos" "/perfil-nelson-vahos.html" "/vcard/nelson-vahos.vcf" "/assets/qr/perfil-nelson-vahos.svg" "/assets/qr/contacto-nelson-vahos.svg" "/assets/qr/perfil-nelson-vahos.png" "/assets/qr/contacto-nelson-vahos.png" "/assets/directorio/perfiles/nelson-vahos.jpg" "/assets/directorio/perfiles/nelson-vahos-og.jpg" "/css/temas/institucional.css" "/desafio-100-empresas/" "/perfil-tomas-velazquez" "/perfil-carlos-d-castillo" "/perfil-santa-latino" "/perfil-1juanromero1" "/quien-puede-ayudarte" "/planes-directorio"; do
            printf "%-50s %s\n" "$u" "$(curl -s -o /tmp/b -w '%{http_code} %{redirect_url}' "$P$u") $(grep -o '<title>[^<]*' /tmp/b | head -1 | cut -c8-80)"
          done | tee /tmp/out/estados.txt
          echo "--- vCard servida" | tee -a /tmp/out/estados.txt
          curl -s "$P/vcard/nelson-vahos.vcf" | tee -a /tmp/out/estados.txt
          echo "--- QR iguales a los del repositorio" | tee -a /tmp/out/estados.txt
          for f in perfil-nelson-vahos.svg contacto-nelson-vahos.svg perfil-nelson-vahos.png contacto-nelson-vahos.png; do
            curl -s "$P/assets/qr/$f" -o /tmp/q && cmp -s /tmp/q assets/qr/$f && echo "$f idéntico" || echo "$f DIFERENTE"
          done | tee -a /tmp/out/estados.txt
      - name: Enlaces internos hacia la miniweb
        if: always()
        run: |
          for u in /publicidad /desafio-100-empresas/; do echo "$u → $(curl -s "$P$u" | grep -o 'href="/perfil-nelson-vahos"[^<]*' | head -1)"; done | tee -a /tmp/out/estados.txt
      - name: Decodificar los QR (dirección que abren)
        if: always()
        run: |
          sudo apt-get install -y -qq zbar-tools >/dev/null 2>&1 || true
          for f in perfil-nelson-vahos.png contacto-nelson-vahos.png; do curl -s "$P/assets/qr/$f" -o /tmp/$f; echo "$f → $(zbarimg -q --raw /tmp/$f)"; done | tee -a /tmp/out/estados.txt
      - name: E2E miniweb Nelson Vahos (computador, tableta, celular; sin y con JavaScript)
        if: always()
        run: BASE=$P SHOTS=/tmp/out NODE_PATH=/tmp/pw/node_modules NODE_OPTIONS="--require $PWD/tmp-prod/sin-estadisticas.cjs" node tests/e2e-nelson-vahos.cjs 2>&1 | tee /tmp/out/e2e-nelson.txt; exit ${PIPESTATUS[0]}
      - name: E2E miniwebs existentes, directorio y planes
        if: always()
        run: |
          r=0
          for t in santa-latino planes-directorio desafio menu; do
            BASE=$P NODE_PATH=/tmp/pw/node_modules NODE_OPTIONS="--require $PWD/tmp-prod/sin-estadisticas.cjs" node tests/e2e-$t.cjs 2>&1 | grep -v "^\s*at " | tail -12 | tee /tmp/out/e2e-$t.txt; [ ${PIPESTATUS[0]} = 0 ] || r=1
          done; exit $r
      - name: Publicar
        if: always()
        run: |
          cd /tmp/out && git init -q -b datos && git config user.name datos && git config user.email datos@users.noreply.github.com && git add -A && git commit -qm "vista previa nelson [CF-Pages-Skip]"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" datos:refs/heads/claude/miniweb-nelson-vahos-vista-datos
