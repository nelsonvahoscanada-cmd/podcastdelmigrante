# TEMPORAL: verificar la vista previa del PR #137 (solo lectura; sin estadísticas). Se elimina después.
name: tmp premium vista previa
on:
  push:
    branches: [claude/nelson-premium-cta-vista]
permissions:
  contents: write
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      P: https://claude-nelson-premium-cta.podcastdelmigrante.pages.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Esperar la vista previa (máx. 20 min)
        run: |
          for i in $(seq 120); do
            curl -fsS "$P/perfil-nelson-vahos?nc=$i$RANDOM" | grep -q 'biz-premium__btn' && { echo "lista (intento $i)"; exit 0; }
            sleep 10
          done; exit 1
      - name: Estados HTTP y demás miniwebs
        if: always()
        run: |
          mkdir -p /tmp/out
          { for u in /perfil-nelson-vahos /css/temas/institucional.css /perfil-santa-latino /perfil-tomas-velazquez /perfil-1juanromero1 /perfil-carlos-d-castillo /planes-directorio /registra-tu-empresa; do printf "%-40s %s\n" "$u" "$(curl -s -o /dev/null -w '%{http_code}' "$P$u")"; done
            echo "institucional.css servida = rama: $(curl -s "$P/css/temas/institucional.css" | cmp -s - css/temas/institucional.css && echo idéntica || echo DIFERENTE)"
          } | tee /tmp/out/estados.txt
      - run: mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i -s playwright && npx playwright install --with-deps chromium >/dev/null
      - name: E2E (iPhone SE, iPhone 13, iPhone 14 Pro Max, tableta, computador)
        if: always()
        run: |
          r=0
          for t in nelson-premium nelson-video nelson-vahos santa-latino; do
            BASE=$P SHOTS=/tmp/out NODE_PATH=/tmp/pw/node_modules NODE_OPTIONS="--require $PWD/tmp-prod/sin-estadisticas.cjs" node tests/e2e-$t.cjs 2>&1 | grep -v "^\s*at " | tail -12 | tee /tmp/out/e2e-$t.txt; [ ${PIPESTATUS[0]} = 0 ] || r=1
          done; exit $r
      - name: Publicar
        if: always()
        run: |
          cd /tmp/out && git init -q -b datos && git config user.name datos && git config user.email datos@users.noreply.github.com && git add -A && git commit -qm "vista previa Premium [CF-Pages-Skip]"
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" datos:refs/heads/claude/nelson-premium-cta-vista-datos-${{ github.run_number }}
