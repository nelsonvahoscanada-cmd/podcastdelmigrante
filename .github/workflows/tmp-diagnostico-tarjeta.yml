# TEMPORAL: diagnóstico de la tarjeta del fundador en producción (solo lectura; sin estadísticas). Se elimina después.
name: tmp diagnostico tarjeta fundador
on:
  push:
    branches: [claude/fundador-diagnostico]
permissions:
  contents: write
jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Cabeceras de caché y huellas (producción vs. repositorio)
        run: |
          mkdir -p /tmp/out; P=https://podcastdelmigrante.com
          for u in / /index.html /css/styles.css /css/fonts.css "/js/main.js" /assets/directorio/perfiles/nelson-vahos-480.webp; do
            echo "=== $u"; curl -sI "$P$u" | grep -i -E "^(HTTP|cache-control|age|etag|last-modified|cf-cache-status|content-type)"
          done | tee /tmp/out/cabeceras.txt
          echo "=== huellas sha256 (producción · repositorio main)" | tee /tmp/out/huellas.txt
          curl -s "$P/" -o /tmp/index-prod.html; curl -s "$P/css/styles.css" -o /tmp/styles-prod.css
          echo "index.html  $(sha256sum < /tmp/index-prod.html | cut -c1-16) · $(sha256sum < index.html | cut -c1-16)" | tee -a /tmp/out/huellas.txt
          echo "styles.css  $(sha256sum < /tmp/styles-prod.css | cut -c1-16) · $(sha256sum < css/styles.css | cut -c1-16)" | tee -a /tmp/out/huellas.txt
          echo "styles.css del PR #128: $(sha256sum < tmp-prod/styles-pr128.css | cut -c1-16)" | tee -a /tmp/out/huellas.txt
          diff <(sed 's/<!--.*-->//' /tmp/index-prod.html) <(sed 's/<!--.*-->//' index.html) | head -20 | tee -a /tmp/out/huellas.txt
          grep -c "fundador__cab" /tmp/styles-prod.css | sed 's/^/reglas .fundador__cab en styles.css de producción: /' | tee -a /tmp/out/huellas.txt
          grep -n 'stylesheet' /tmp/index-prod.html | tee -a /tmp/out/huellas.txt
      - run: cd /tmp && mkdir -p pw && cd pw && npm init -y >/dev/null && npm i -s playwright && npx playwright install --with-deps chromium >/dev/null
      - name: Capturas y medidas (producción, CSS anterior en caché, vista previa aprobada)
        run: NODE_PATH=/tmp/pw/node_modules node tmp-prod/diag-tarjeta.cjs 2>&1 | tee /tmp/out/medidas.txt
      - name: Publicar
        if: always()
        run: |
          cd /tmp/out && git init -q -b datos && git config user.name datos && git config user.email datos@users.noreply.github.com && git add -A && git commit -qm "diagnostico tarjeta [CF-Pages-Skip]"
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" datos:refs/heads/claude/fundador-diagnostico-datos-${{ github.run_number }}
