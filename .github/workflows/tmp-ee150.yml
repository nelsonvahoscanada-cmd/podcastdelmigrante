name: tmp express entry 150
on:
  push:
    branches: [claude/laughing-albattani-1rvkc1-express-entry-150]
    paths: [".github/workflows/tmp-ee150.yml"]
permissions:
  contents: write
jobs:
  fuentes:
    runs-on: ubuntu-latest
    steps:
      - name: TikTok, fuentes IRCC y ocupaciones elegibles (solo lectura)
        continue-on-error: true
        run: |
          mkdir -p /tmp/out; cd /tmp/out
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Safari/537.36"
          {
          echo "== TikTok"
          L=$(curl -sIL -A "$UA" -o /dev/null -w "%{url_effective}" "https://vt.tiktok.com/ZSpJ54oy5/"); echo "FINAL $L"
          V=$(echo "$L" | grep -oE "/video/[0-9]+" | grep -oE "[0-9]+"); U2=$(echo "$L" | grep -oE "@[^/?]+")
          echo "ID $V USER $U2"
          curl -s "https://www.tiktok.com/oembed?url=https://www.tiktok.com/$U2/video/$V" -o oembed.json
          python3 -c "import json; d=json.load(open('oembed.json')); print({k:d.get(k) for k in ['title','author_name','author_unique_id','thumbnail_url','thumbnail_width','thumbnail_height','embed_product_id']})"
          T=$(python3 -c "import json; print(json.load(open('oembed.json')).get('thumbnail_url',''))"); [ -n "$T" ] && curl -sL "$T" -o tiktok-portada.jpg && file tiktok-portada.jpg
          curl -s -o /dev/null -w "player HTTP %{http_code}\n" -A "$UA" "https://www.tiktok.com/player/v1/$V"
          echo "== IRCC"
          for u in https://www.canada.ca/en/immigration-refugees-citizenship/news/2026/10/canada-refocusing-express-entry-on-top-talent-that-drives-economic-growth.html https://www.canada.ca/en/immigration-refugees-citizenship/services/immigrate-canada/express-entry/changes.html; do curl -sL -A "$UA" -o /dev/null -w "%{http_code} $u\n" "$u"; done
          curl -sL -A "$UA" https://www.canada.ca/en/immigration-refugees-citizenship/services/immigrate-canada/express-entry/changes.html -o changes.html
          python3 - <<'PY'
          import re
          t=open("changes.html",encoding="utf-8",errors="ignore").read()
          for m in re.finditer(r'<a[^>]+href="([^"]+)"[^>]*>([^<]*(?:jobs are eligible|eligible|high-wage|occupation)[^<]*)</a>',t,re.I): print("ENLACE",m.group(1),"|",m.group(2).strip())
          PY
          } 2>&1 | tee log.txt
          for u in $(grep -oE "ENLACE [^ ]+" log.txt | awk '{print $2}' | sort -u | head -4); do case $u in http*) U=$u;; *) U="https://www.canada.ca$u";; esac; n=$(echo "$U" | md5sum | cut -c1-6); curl -sL -A "$UA" "$U" -o "ocup-$n.html"; python3 - "ocup-$n.html" "$U" >> ocupaciones.txt <<'PY'
          import re,html,sys
          t=open(sys.argv[1],encoding="utf-8",errors="ignore").read()
          t=html.unescape(re.sub(r"<[^>]+>"," ",re.sub(r"(?s)<(script|style|nav|header|footer).*?</\1>","",t))); t=re.sub(r"\s+"," ",t)
          print("=====",sys.argv[2]); print(t[:30000])
          PY
          done
      - name: Publicar en la rama de datos
        run: |
          cd /tmp/out && rm -f changes.html ocup-*.html && git init -q -b datos && git config user.name "datos" && git config user.email "datos@users.noreply.github.com"
          git add -A && git commit -qm "Fuentes Express Entry 150 [CF-Pages-Skip]"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" datos:refs/heads/claude/laughing-albattani-1rvkc1-ee150-datos
