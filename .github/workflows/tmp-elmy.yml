name: tmp elmy enlaces
on:
  push:
    branches: [claude/laughing-albattani-1rvkc1-elmy-rural]
    paths: [".github/workflows/tmp-elmy.yml"]
permissions:
  contents: write
jobs:
  enlaces:
    runs-on: ubuntu-latest
    steps:
      - name: Enlaces oficiales y fuentes (solo lectura)
        continue-on-error: true
        run: |
          mkdir -p /tmp/out; cd /tmp/out
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Safari/537.36"
          for u in \
            https://www.albertahealthservices.ca/info/Page12630.aspx \
            https://albertahealthservices.ca/info/Page12630.aspx \
            https://ahs.ca/811 \
            https://primarycarealberta.ca/ \
            https://albertafindaprovider.ca/ \
            https://www.albertahealthservices.ca/waittimes/waittimes.aspx \
            https://www.cmaj.ca/content/188/6/E100 \
            https://pmc.ncbi.nlm.nih.gov/articles/PMC1227945/ ; do
            n=$(echo "$u" | md5sum | cut -c1-6)
            echo "$(curl -sL --max-time 60 -A "$UA" -o p-$n.html -w '%{http_code} %{url_effective}' "$u") | $(grep -o '<title>[^<]*' p-$n.html | head -1 | tr -s ' \n' ' ')"
          done | tee enlaces.txt
          python3 - <<'PY' >> extractos.txt
          import re,html,glob
          for f in sorted(glob.glob("p-*.html")):
              t=open(f,encoding="utf-8",errors="ignore").read()
              t=html.unescape(re.sub(r"<[^>]+>"," ",re.sub(r"(?s)<(script|style)[^>]*>.*?</\1>","",t))); t=re.sub(r"\s+"," ",t)
              print("=====",f)
              for kw in ["911","registered nurse","24/7","rural","8%","19%","18%","regular health care provider","84.2","82.5","continuity","emergency department","Find a Doctor","family doctor","refer","prescrib","minor ailment"]:
                  for m in list(re.finditer(re.escape(kw),t))[:2]:
                      print(f"  [{kw}]", t[max(0,m.start()-200):m.end()+200])
          PY
          rm -f p-*.html
      - name: Publicar en la rama de datos
        run: |
          cd /tmp/out && git init -q -b datos && git config user.name "datos" && git config user.email "datos@users.noreply.github.com"
          git add -A && git commit -qm "Enlaces Elmy 2 [CF-Pages-Skip]"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" datos:refs/heads/claude/laughing-albattani-1rvkc1-elmy-datos
