name: tmp nunavut enlaces
on:
  push:
    branches: [claude/laughing-albattani-1rvkc1-nu-enlaces-run]
    paths: [".github/workflows/tmp-nu-enlaces.yml"]
permissions:
  contents: write
jobs:
  enlaces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q playwright && python -m playwright install --with-deps chromium >/dev/null
      - run: mkdir -p /tmp/out && python scripts/canada-en-datos/verificar-enlaces-nu.py > /tmp/out/enlaces.log 2>&1; echo "exit $?" >> /tmp/out/enlaces.log; tail -15 /tmp/out/enlaces.log
      - if: always()
        run: |
          cd /tmp/out && git init -q -b datos && git config user.name datos && git config user.email datos@users.noreply.github.com && git add -A && git commit -qm "enlaces [CF-Pages-Skip]"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" datos:refs/heads/claude/laughing-albattani-1rvkc1-nu-enlaces
