name: tmp BC obtener localidades
on:
  push:
    branches: [claude/laughing-albattani-1rvkc1]
    paths: [".github/workflows/tmp-bc-obtener.yml", "scripts/canada-en-datos/obtener-bc-localidades.py"]
permissions:
  contents: read
jobs:
  obtener:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl pyproj shapely
      - run: python3 scripts/canada-en-datos/obtener-bc-localidades.py
