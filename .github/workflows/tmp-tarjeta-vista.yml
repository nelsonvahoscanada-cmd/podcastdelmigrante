# TEMPORAL: verificar la vista previa del PR #129 (solo lectura; sin estadísticas). Se elimina después.
name: tmp tarjeta fundador vista previa
on:
  push:
    branches: [claude/fundador-tarjeta-vista]
permissions:
  contents: write
jobs:
  verificar:
    runs-on: ubuntu-latest
    env:
      P: https://claude-fundador-tarjeta.podcastdelmigrante.pages.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Esperar la vista previa con la tarjeta nueva (máx. 15 min)
        run: |
          for i in $(seq 90); do
            curl -fsS "$P/?nc=$i$RANDOM" | grep -q '<h3 class="fundador__nombre">Nelson Vahos</h3>' && { echo "vista previa lista (intento $i)"; exit 0; }
            sleep 10
          done; exit 1
      - run: mkdir -p /tmp/out /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i -s playwright && npx playwright install --with-deps chromium >/dev/null
      - name: Estados HTTP
        if: always()
        run: |
          for u in / /perfil-nelson-vahos /assets/directorio/perfiles/nelson-vahos-480.webp /assets/directorio/perfiles/nelson-vahos-720.webp /assets/directorio/perfiles/nelson-vahos-480.jpg /css/styles.css; do printf "%-55s %s\n" "$u" "$(curl -s -o /dev/null -w '%{http_code} %{content_type}' "$P$u")"; done | tee /tmp/out/estados.txt
      - name: E2E (computador, tableta y tres celulares; sin y con JavaScript)
        if: always()
        run: |
          r=0
          for t in fundador-portada nelson-vahos menu; do
            BASE=$P SHOTS=/tmp/out NODE_PATH=/tmp/pw/node_modules NODE_OPTIONS="--require $PWD/tmp-prod/sin-estadisticas.cjs" node tests/e2e-$t.cjs 2>&1 | grep -v "^\s*at " | tail -12 | tee /tmp/out/e2e-$t.txt; [ ${PIPESTATUS[0]} = 0 ] || r=1
          done; exit $r
      - name: Publicar
        if: always()
        run: |
          cd /tmp/out && git init -q -b datos && git config user.name datos && git config user.email datos@users.noreply.github.com && git add -A && git commit -qm "vista previa tarjeta [CF-Pages-Skip]"
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" datos:refs/heads/claude/fundador-tarjeta-vista-datos-${{ github.run_number }}
