name: tmp estado del registro
on:
  push:
    branches: [claude/laughing-albattani-1rvkc1]
    paths: [".github/workflows/tmp-registro-estado.yml"]
permissions:
  contents: read
jobs:
  estado:
    runs-on: ubuntu-latest
    steps:
      - name: formulario y panel (solo lectura)
        run: |
          echo "CONFIG|$(curl -s https://podcastdelmigrante.com/registro/config)"
          echo "FORM|$(curl -s -o /dev/null -w '%{http_code}' https://podcastdelmigrante.com/registra-tu-empresa)"
          curl -s -o /dev/null -D - https://admin.podcastdelmigrante.com/solicitudes | grep -iE "^HTTP|^location" | sed 's/[?].*//' | sed 's/^/PANEL|/'
      - name: DNS del dominio de envío (Resend)
        run: |
          for d in correo.podcastdelmigrante.com envios.podcastdelmigrante.com podcastdelmigrante.com; do
            for n in "resend._domainkey.$d TXT" "send.$d MX" "send.$d TXT" "$d MX" "_dmarc.$d TXT"; do
              set -- $n; echo "DNS|$1 $2| $(dig +short $1 $2 @1.1.1.1 | cut -c1-80 | tr '\n' ' ')"
            done
          done
