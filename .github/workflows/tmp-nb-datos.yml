# TEMPORAL: obtener los datos oficiales de Nuevo Brunswick (solo lectura). Se elimina después.
name: tmp nb datos
on:
  push:
    branches: [claude/canada-datos-nb-run]
permissions:
  contents: write
jobs:
  datos:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q openpyxl pyproj shapely playwright && python -m playwright install --with-deps chromium >/dev/null
      - run: mkdir -p /tmp/out
      - name: Quinta ronda
        continue-on-error: true
        run: python scripts/canada-en-datos/obtener-nb-ficha.py ronda5 2>&1 | tee /tmp/out/ronda5.log
      - name: Publicar
        if: always()
        run: |
          cd /tmp/out && git init -q -b datos && git config user.name datos && git config user.email datos@users.noreply.github.com && git add -A && git commit -qm "datos Nuevo Brunswick [CF-Pages-Skip]"
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" datos:refs/heads/claude/canada-datos-nb-datos-${{ github.run_number }}
