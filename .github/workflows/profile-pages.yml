name: "Perfiles: vistas previas"

# Verifica que cada perfil publicado en js/businesses.js tenga su
# perfil-<slug>.html al día (metadatos para WhatsApp, Facebook, iMessage...).
# Si falla: node scripts/build-profile-pages.mjs  y subir los cambios.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-profile-pages.mjs --check
