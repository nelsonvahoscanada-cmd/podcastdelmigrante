# TEMPORAL: obtener los datos oficiales de Nueva Escocia (solo lectura). Se elimina después.
name: tmp ns datos
on:
  push:
    branches: [claude/canada-datos-ns-run]
permissions:
  contents: write
jobs:
  datos:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q openpyxl pyproj shapely playwright && python -m playwright install --with-deps chromium >/dev/null
      - run: mkdir -p /tmp/out
      - name: Localidades
        continue-on-error: true
        run: python scripts/canada-en-datos/obtener-ns-localidades.py 2>&1 | tee /tmp/out/localidades.log
      - name: Sitemaps
        continue-on-error: true
        run: python scripts/canada-en-datos/obtener-ns-ficha.py mapa 2>&1 | tee /tmp/out/mapa.log
      - name: Datos abiertos y bandera
        continue-on-error: true
        run: python scripts/canada-en-datos/obtener-ns-ficha.py datos bandera 2>&1 | tee /tmp/out/datos.log
      - name: Páginas
        continue-on-error: true
        run: python scripts/canada-en-datos/obtener-ns-ficha.py paginas 2>&1 | tee /tmp/out/paginas.log
      - name: Publicar
        if: always()
        run: |
          cd /tmp/out && git init -q -b datos && git config user.name datos && git config user.email datos@users.noreply.github.com && git add -A && git commit -qm "datos Nueva Escocia [CF-Pages-Skip]"
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" datos:refs/heads/claude/canada-datos-ns-datos-${{ github.run_number }}
