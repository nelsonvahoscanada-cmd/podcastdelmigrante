# TEMPORAL: prueba controlada del Worker de estadísticas (1 evento técnico por empresa,
# event=qr_profile_download, target=prueba-tecnica; no cuenta como visita ni clic). Se elimina después.
name: prueba-stats
on:
  push:
    branches: [claude/laughing-albattani-1rvkc1-stats-prueba]
permissions:
  contents: read
jobs:
  prueba:
    runs-on: ubuntu-latest
    steps:
      - run: |
          E=https://podcastdelmigrante.com/api/events
          curl -s -w ' health %{http_code}\n' "$E/health"
          for p in "BIZ-001 tomas-velazquez" "BIZ-002 carlos-d-castillo" "BIZ-003 santa-latino" "BIZ-004 1juanromero1"; do
            set -- $p
            curl -s -o r.txt -w "$1 $2: %{http_code} " -X POST "$E" -H 'Origin: https://podcastdelmigrante.com' -H 'Content-Type: text/plain;charset=UTF-8' \
              -H 'User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Safari/537.36' \
              --data "{\"event\":\"qr_profile_download\",\"business_id\":\"$1\",\"business\":\"$2\",\"target\":\"prueba-tecnica\",\"page\":\"/perfil-$2\"}"; cat r.txt; echo
          done
