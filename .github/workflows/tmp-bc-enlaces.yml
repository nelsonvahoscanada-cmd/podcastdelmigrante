name: tmp BC enlaces
on:
  push:
    branches: [claude/laughing-albattani-1rvkc1]
    paths: [".github/workflows/tmp-bc-enlaces.yml", ".github/tmp/verificar-enlaces-bc.py"]
permissions:
  contents: read
jobs:
  enlaces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install playwright==1.47.0 && python3 -m playwright install --with-deps chromium
      - run: python3 .github/tmp/verificar-enlaces-bc.py
