# TEMPORAL: verificar en producción la noticia de las 33.000 residencias (solo lectura). Se elimina después.
name: tmp prod 33000
on:
  push:
    branches: [claude/residencias-33000-prod]
permissions:
  contents: write
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Esperar el despliegue en producción (máx. 15 min)
        run: |
          for i in $(seq 90); do
            curl -fsS "https://podcastdelmigrante.com/js/data.js?nocache=$i$RANDOM" | grep -q canada-33000-residencias && curl -fsS -o /dev/null https://podcastdelmigrante.com/articulo-canada-33000-residencias-permanentes-trabajadores-2026 && { echo desplegado; exit 0; }
            sleep 10
          done; exit 1
      - run: mkdir -p /tmp/out /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i -s playwright && npx playwright install --with-deps chromium >/dev/null
      - name: E2E de la noticia contra producción (TikTok y Canada.ca bloqueados; estadísticas simuladas)
        run: NODE_PATH=/tmp/pw/node_modules NODE_OPTIONS="--require $PWD/tmp-prod/simular-vistas.cjs" BASE=https://podcastdelmigrante.com SHOTS=/tmp/out node tests/e2e-residencias-33000.cjs 2>&1 | tee /tmp/out/e2e.txt; exit ${PIPESTATUS[0]}
      - name: TikTok real, imagen social, sitemap y HTML
        if: always()
        run: NODE_PATH=/tmp/pw/node_modules node tmp-prod/extra.cjs 2>&1 | tee /tmp/out/extra.txt; exit ${PIPESTATUS[0]}
      - name: Fuentes oficiales accesibles
        if: always()
        shell: python3 {0}
        run: |
          import re, urllib.request
          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Safari/537.36", "Accept-Language": "en-CA"}
          h = urllib.request.urlopen("https://podcastdelmigrante.com/articulo-canada-33000-residencias-permanentes-trabajadores-2026", timeout=60).read().decode()
          urls = sorted(set(re.findall(r'href="(https://www\.canada\.ca/[^"]+)"', h)))
          res = []
          for u in urls:
              try:
                  with urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=60) as r: res.append(f"{r.status} {u}")
              except Exception as e: res.append(f"ERR {getattr(e,'code',type(e).__name__)} {u}")
          open("/tmp/out/fuentes.txt", "w").write("\n".join(res)); print("\n".join(res))
      - name: Fuentes con navegador (si la lectura directa falla)
        if: always()
        run: |
          cat > /tmp/f.cjs <<'JS'
          const { chromium } = require("playwright"); const fs = require("fs");
          (async () => { const b = await chromium.launch(); const p = await b.newPage(); const out = [];
            const urls = fs.readFileSync("/tmp/out/fuentes.txt", "utf8").split("\n").filter((l) => !l.startsWith("200 ")).map((l) => l.split(" ").pop()).filter(Boolean);
            for (const u of urls) { try { const r = await p.goto(u, { waitUntil: "domcontentloaded", timeout: 60000 }); out.push(`${r && r.status()} ${(await p.title()).slice(0, 80)} | ${u}`); } catch (e) { out.push(`ERR ${e.message.slice(0, 60)} ${u}`); } }
            fs.writeFileSync("/tmp/out/fuentes-navegador.txt", out.join("\n")); console.log(out.join("\n")); await b.close(); })();
          JS
          NODE_PATH=/tmp/pw/node_modules node /tmp/f.cjs
      - name: Publicar
        if: always()
        run: |
          cd /tmp/out && git init -q -b datos && git config user.name datos && git config user.email datos@users.noreply.github.com && git add -A && git commit -qm "prod 33000 [CF-Pages-Skip]"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" datos:refs/heads/claude/residencias-33000-prod-datos
