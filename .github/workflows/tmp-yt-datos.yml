# TEMPORAL: verificar enlaces de la guía de Yukón (solo lectura). Se elimina después.
name: tmp yt datos
on:
  push:
    branches: [claude/yukon-canada-en-datos-run]
permissions:
  contents: write
jobs:
  datos:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q playwright && python -m playwright install --with-deps chromium >/dev/null
      - run: mkdir -p /tmp/out && python .github/enlaces/verificar.py
        continue-on-error: true
      - name: Publicar
        if: always()
        run: |
          cd /tmp/out && git init -q -b datos && git config user.name datos && git config user.email datos@users.noreply.github.com && git add -A && git commit -qm "enlaces Yukon [CF-Pages-Skip]"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" datos:refs/heads/claude/yukon-canada-en-datos-enlaces
