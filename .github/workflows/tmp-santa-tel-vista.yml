# TEMPORAL: verificar la vista previa del PR #140 (solo lectura; sin estadísticas). Se elimina después.
name: tmp santa tel vista
on:
  push:
    branches: [claude/santa-latino-telefono-vista]
permissions:
  contents: write
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      P: https://claude-santa-latino-telefono.podcastdelmigrante.pages.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Vista previa (solo GET)
        run: |
          mkdir -p /tmp/out; o=/tmp/out/vista.txt
          for i in $(seq 60); do curl -fsS "$P/perfil-santa-latino?nc=$RANDOM" | grep -q 'tel:+12899686235' && break; sleep 10; done
          curl -fsS "$P/perfil-santa-latino?nc=$RANDOM" -o /tmp/h
          { echo "tel: $(grep -o 'href="tel:[^"]*" data-track="phone_click" data-track-target="[^"]*"' /tmp/h | tr '\n' ' ')"
            echo "whatsapp: $(grep -o 'href="https://wa.me/[^"]*"[^>]*data-track-target="[^"]*"' /tmp/h | tr '\n' ' ')"
            echo "JSON-LD: $(grep -o '"telephone":"[^"]*"' /tmp/h)"
            echo "número anterior en la página: $(grep -c '6965721' /tmp/h) (solo WhatsApp)"
            echo "vCard: $(curl -fsS "$P/vcard/santa-latino.vcf?nc=$RANDOM" | grep TEL)"
            for f in assets/qr/contacto-santa-latino.png assets/qr/perfil-santa-latino.png css/temas/navidad.css; do curl -fsS "$P/$f" -o /tmp/f && cmp -s /tmp/f $f && echo "igual $f" || echo "DISTINTO $f"; done
          } | tee $o
      - run: mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i -s playwright && npx playwright install --with-deps chromium >/dev/null
      - name: E2E en la vista previa (estadísticas bloqueadas)
        if: always()
        run: |
          r=0
          for t in santa-latino santa-latino-galeria; do
            BASE=$P SHOTS=/tmp/out NODE_PATH=/tmp/pw/node_modules NODE_OPTIONS="--require $PWD/tmp-prod/sin-estadisticas.cjs" node tests/e2e-$t.cjs 2>&1 | grep -v "^\s*at " | tail -20 | tee /tmp/out/e2e-$t.txt; [ ${PIPESTATUS[0]} = 0 ] || r=1
          done; exit $r
      - name: Publicar
        if: always()
        run: |
          cd /tmp/out && git init -q -b datos && git config user.name datos && git config user.email datos@users.noreply.github.com && git add -A && git commit -qm "vista previa Santa Latino teléfono [CF-Pages-Skip]"
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" datos:refs/heads/claude/santa-latino-telefono-vista-datos-${{ github.run_number }}
