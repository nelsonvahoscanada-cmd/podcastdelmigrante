name: tmp MB produccion
on:
  push:
    branches: [claude/laughing-albattani-1rvkc1-manitoba]
    paths: [".github/workflows/tmp-mb-prod.yml"]
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        prueba: [e2e-manitoba-localidades, e2e-canada-datos, e2e-saskatchewan-localidades, e2e-alberta-localidades, e2e-ontario-localidades, e2e-british-columbia-localidades, e2e-prince-edward-island-localidades, e2e-menu, e2e-noticias, e2e-hector-rivero, e2e-alberta-bomberos]
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.48.0 >/dev/null && npx playwright install --with-deps chromium >/dev/null
      - name: Simulador del contador (solo lectura; no genera visitas en producción)
        run: |
          cat > /tmp/pw/vistas.cjs <<'JS'
          const pw = require("/tmp/pw/node_modules/playwright");
          const orig = pw.chromium.launch.bind(pw.chromium);
          pw.chromium.launch = async (...a) => {
            const b = await orig(...a);
            const nc = b.newContext.bind(b);
            b.newContext = async (...o) => { const c = await nc(...o); await c.route(/\/api\/(vistas|events)/, (r) => r.fulfill({ status: 200, contentType: "application/json", body: '{"ok":true,"vistas":0}' })); return c; };
            const np = b.newPage.bind(b);
            b.newPage = async (...o) => { const c = await b.newContext(...o); return c.newPage(); };
            return b;
          };
          JS
      - run: node tests/${{ matrix.prueba }}.cjs
        env:
          BASE: https://podcastdelmigrante.com
          NODE_PATH: /tmp/pw/node_modules
          NODE_OPTIONS: --require /tmp/pw/vistas.cjs
  sitio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Archivos publicados idénticos a main y rutas principales
        run: |
          B=https://podcastdelmigrante.com
          for f in css/canada-datos.css js/canada-datos.js js/manitoba-localidades.js js/canada-reloj.js js/canada-reloj-localidad.js js/saskatchewan-localidades.js js/canada-directorio.js js/articles.js js/directorio/solicitud-form.js registra-tu-empresa.html sitemap.xml; do
            curl -sf "$B/$f" -o /tmp/x; if cmp -s /tmp/x "$f"; then echo "IGUAL $f"; else echo "DISTINTO $f"; fi
          done
          for r in /canada-en-datos/ /canada-en-datos/manitoba /canada-en-datos/manitoba/winnipeg /canada-en-datos/manitoba/flin-flon /canada-en-datos/manitoba/gambler-63-division-15 /canada-en-datos/saskatchewan /canada-en-datos/alberta /canada-en-datos/ontario /canada-en-datos/british-columbia /canada-en-datos/prince-edward-island / /noticias.html /registra-tu-empresa.html /admin/ /articulo-multas-representantes-migratorios-canada-2026 /assets/canada-en-datos/social-manitoba.jpg /assets/canada-en-datos/manitoba-regiones.svg; do
            echo "$(curl -s -o /dev/null -w '%{http_code}' "$B$r") $r"
          done
          echo "mapa principal (provincias con ficha):"
          curl -s "$B/canada-en-datos/" | grep -o 'class="cd-region cd-region--ficha" data-code="[A-Z]*"' | sort
          curl -s "$B/canada-en-datos/manitoba" | grep -o '<meta property="og:[a-z:]*" content="[^"]*"'
          echo "sitemap MB: $(curl -s "$B/sitemap.xml" | grep -c 'canada-en-datos/manitoba')"
          echo "todas las páginas de MB (239):"
          ls canada-en-datos/manitoba | while read f; do curl -s -o /dev/null -w '%{http_code}\n' "$B/canada-en-datos/manitoba/${f%.html}"; done | sort | uniq -c
          echo "fichas completas (reloj local):"
          for s in winnipeg brandon steinbach thompson portage-la-prairie winkler selkirk morden dauphin flin-flon the-pas swan-river neepawa; do echo "$s reloj=$(curl -s "$B/canada-en-datos/manitoba/$s" | grep -c 'data-reloj-localidad')"; done
