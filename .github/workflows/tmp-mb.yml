name: tmp MB
on:
  push:
    branches: [claude/laughing-albattani-1rvkc1-manitoba]
    paths: [".github/workflows/tmp-mb.yml", "scripts/canada-en-datos/obtener-localidades-censo.py", "scripts/canada-en-datos/obtener-ficha-provincia.py", "scripts/canada-en-datos/mb-paginas.py", "scripts/canada-en-datos/mb-paginas2.py"]
permissions:
  contents: read
jobs:
  paginas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install playwright==1.48.0 && python3 -m playwright install --with-deps chromium
      - run: python3 scripts/canada-en-datos/obtener-ficha-provincia.py Manitoba paginas scripts/canada-en-datos/mb-paginas2.py
