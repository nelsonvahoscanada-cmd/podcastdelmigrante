# TEMPORAL: verificar la vista previa del PR #135 (solo lectura; sin estadísticas). Se elimina después.
name: tmp nelson video vista previa
on:
  push:
    branches: [claude/nelson-video-premium-vista]
permissions:
  contents: write
jobs:
  verificar:
    runs-on: ubuntu-latest
    env:
      P: https://claude-nelson-video-premium.podcastdelmigrante.pages.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Esperar la vista previa (máx. 15 min)
        run: |
          for i in $(seq 90); do
            curl -fsS "$P/perfil-nelson-vahos?nc=$i$RANDOM" | grep -q 'data-video-id="ZlUEYjQpEpE"' && { echo "lista (intento $i)"; exit 0; }
            sleep 10
          done; exit 1
      - name: Estados HTTP y archivos que no deben cambiar
        if: always()
        run: |
          mkdir -p /tmp/out
          { for u in /perfil-nelson-vahos /assets/yt/ZlUEYjQpEpE.jpg /vcard/nelson-vahos.vcf /assets/qr/perfil-nelson-vahos.svg /assets/qr/contacto-nelson-vahos.svg /assets/directorio/perfiles/nelson-vahos.jpg /perfil-santa-latino /perfil-tomas-velazquez /perfil-1juanromero1 /perfil-carlos-d-castillo; do printf "%-50s %s\n" "$u" "$(curl -s -o /dev/null -w '%{http_code} %{content_type}' "$P$u")"; done
            for f in vcard/nelson-vahos.vcf assets/qr/perfil-nelson-vahos.svg assets/qr/contacto-nelson-vahos.svg assets/directorio/perfiles/nelson-vahos.jpg; do echo "$f servido = repositorio: $(curl -s "$P/$f" | cmp -s - $f && echo sí || echo NO)"; done
            echo "embed de YouTube: $(curl -s -o /dev/null -w '%{http_code}' 'https://www.youtube-nocookie.com/embed/ZlUEYjQpEpE')"
            curl -s 'https://www.youtube.com/oembed?url=https://youtu.be/ZlUEYjQpEpE&format=json'; echo
          } 2>&1 | tee /tmp/out/estados.txt
      - run: mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i -s playwright && npx playwright install --with-deps chromium >/dev/null
      - name: E2E (iPhone SE, iPhone 13, iPhone 14 Pro Max, tableta, computador)
        if: always()
        run: |
          r=0
          REAL=1 BASE=$P SHOTS=/tmp/out NODE_PATH=/tmp/pw/node_modules NODE_OPTIONS="--require $PWD/tmp-prod/sin-estadisticas.cjs" node tests/e2e-nelson-video.cjs 2>&1 | grep -v "^\s*at " | tail -25 | tee /tmp/out/e2e-nelson-video-real.txt; [ ${PIPESTATUS[0]} = 0 ] || r=1
          for t in; do
            BASE=$P SHOTS=/tmp/out NODE_PATH=/tmp/pw/node_modules NODE_OPTIONS="--require $PWD/tmp-prod/sin-estadisticas.cjs" node tests/e2e-$t.cjs 2>&1 | grep -v "^\s*at " | tail -10 | tee /tmp/out/e2e-$t.txt; [ ${PIPESTATUS[0]} = 0 ] || r=1
          done; exit $r
      - name: Publicar
        if: always()
        run: |
          cd /tmp/out && git init -q -b datos && git config user.name datos && git config user.email datos@users.noreply.github.com && git add -A && git commit -qm "vista previa video Nelson [CF-Pages-Skip]"
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" datos:refs/heads/claude/nelson-video-premium-vista-datos-${{ github.run_number }}
