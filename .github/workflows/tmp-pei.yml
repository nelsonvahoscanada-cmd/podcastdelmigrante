name: tmp PEI
on:
  push:
    branches: [claude/laughing-albattani-1rvkc1]
    paths: [".github/workflows/tmp-pei.yml", "scripts/canada-en-datos/obtener-pei*.py"]
permissions:
  contents: read
jobs:
  pei:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        parte: [navegador, archivo]
    steps:
      - uses: actions/checkout@v4
      - if: matrix.parte == 'navegador'
        run: pip install playwright==1.47.0 && python3 -m playwright install --with-deps chromium
      - run: python3 scripts/canada-en-datos/obtener-pei-ficha2.py ${{ matrix.parte }}
