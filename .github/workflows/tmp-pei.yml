name: tmp PEI vista previa
on:
  push:
    branches: [claude/laughing-albattani-1rvkc1]
    paths: [".github/workflows/tmp-pei.yml"]
permissions:
  contents: read
jobs:
  vista-previa:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BASE: https://1376cd35.podcastdelmigrante.pages.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save playwright@1.47.0 && npx playwright install --with-deps chromium
      - name: Las 98 páginas, la guía, imágenes y datos (estado y canonical)
        run: |
          fallos=0
          for f in canada-en-datos/prince-edward-island/*.html; do
            s=$(basename $f .html); u="$BASE/canada-en-datos/prince-edward-island/$s"
            h=$(curl -s -w '\n%{http_code}' "$u"); c=$(echo "$h" | tail -1)
            echo "$h" | grep -q "<link rel=\"canonical\" href=\"https://podcastdelmigrante.com/canada-en-datos/prince-edward-island/$s\">" || { echo "SIN CANONICAL $s"; fallos=$((fallos+1)); }
            [ "$c" = 200 ] || { echo "$c $s"; fallos=$((fallos+1)); }
            [ "$(curl -s -o /dev/null -w '%{http_code}' $BASE/assets/canada-en-datos/prince-edward-island/$s.jpg)" = 200 ] || { echo "SIN IMAGEN $s"; fallos=$((fallos+1)); }
          done
          for r in /canada-en-datos/prince-edward-island /canada-en-datos/ /js/prince-edward-island-localidades.js /assets/canada-en-datos/social-prince-edward-island.jpg /canada-en-datos/alberta /canada-en-datos/ontario /canada-en-datos/british-columbia /registra-tu-empresa /noticias; do
            c=$(curl -s -o /dev/null -w '%{http_code}' "$BASE$r"); echo "$c $r"; [ "$c" = 200 ] || fallos=$((fallos+1))
          done
          echo "fallos: $fallos"; [ $fallos = 0 ]
      - name: E2E de PEI en la vista previa (solo lectura; sin contadores)
        run: NODE_OPTIONS="--require ./bloquear.cjs" node tests/e2e-prince-edward-island-localidades.cjs
        working-directory: .
        env:
          NODE_PATH: ${{ github.workspace }}/node_modules
