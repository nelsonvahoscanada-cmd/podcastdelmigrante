name: tmp PEI
on:
  push:
    branches: [claude/laughing-albattani-1rvkc1]
    paths: [".github/workflows/tmp-pei.yml", "scripts/canada-en-datos/obtener-pei*.py"]
permissions:
  contents: read
jobs:
  pei:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        parte: [archivo, censo, enlaces]
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/canada-en-datos/obtener-pei-ficha3.py ${{ matrix.parte }}
