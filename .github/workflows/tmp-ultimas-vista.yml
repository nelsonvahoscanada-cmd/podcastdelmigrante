# TEMPORAL: verificar la vista previa del PR #133 (solo lectura; sin estadísticas). Se elimina después.
name: tmp ultimas noticias vista previa
on:
  push:
    branches: [claude/ultimas-noticias-movil-vista]
permissions:
  contents: write
jobs:
  verificar:
    runs-on: ubuntu-latest
    env:
      P: https://claude-ultimas-noticias-movi.podcastdelmigrante.pages.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Esperar la vista previa (máx. 15 min)
        run: |
          v=$(grep -o 'css/styles.css?v=[0-9a-f]*' index.html)
          for i in $(seq 90); do
            curl -fsS "$P/?nc=$i$RANDOM" | grep -q "$v" && { echo "lista (intento $i)"; exit 0; }
            sleep 10
          done; exit 1
      - run: mkdir -p /tmp/out /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i -s playwright && npx playwright install --with-deps chromium >/dev/null
      - name: E2E (iPhone SE, iPhone 13, iPhone 14 Pro Max, tableta, computador) y portada
        if: always()
        run: |
          r=0
          for t in ultimas-noticias-movil noticias fundador-portada menu; do
            BASE=$P SHOTS=/tmp/out NODE_PATH=/tmp/pw/node_modules NODE_OPTIONS="--require $PWD/tmp-prod/sin-estadisticas.cjs" node tests/e2e-$t.cjs 2>&1 | grep -v "^\s*at " | tail -10 | tee /tmp/out/e2e-$t.txt; [ ${PIPESTATUS[0]} = 0 ] || r=1
          done; exit $r
      - name: Publicar
        if: always()
        run: |
          cd /tmp/out && git init -q -b datos && git config user.name datos && git config user.email datos@users.noreply.github.com && git add -A && git commit -qm "vista previa ultimas noticias [CF-Pages-Skip]"
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" datos:refs/heads/claude/ultimas-noticias-movil-vista-datos-${{ github.run_number }}
