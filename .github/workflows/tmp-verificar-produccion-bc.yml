name: tmp verificar BC en produccion
on:
  push:
    branches: [claude/laughing-albattani-1rvkc1]
    paths: [".github/workflows/tmp-verificar-produccion-bc.yml"]
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      BASE: https://podcastdelmigrante.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-save playwright@1 && npx playwright install --with-deps chromium
      - run: python3 .github/tmp/hora-alberta.py
      - name: Desafío (sin bloquear producción) y miniweb
        run: |
          NODE_OPTIONS="--require ./.github/tmp/sin-visitas.cjs" node -e '
          const { chromium, devices } = require("playwright");
          (async () => {
            const b = await chromium.launch();
            for (const [n, o] of [["computador", { viewport: { width: 1440, height: 900 } }], ["celular", devices["iPhone 13"]]]) {
              for (const r of ["/desafio-100-empresas/", "/desafio-100-empresas/muro-del-legado", "/", "/noticias"]) {
                const c = await b.newContext({ ...o, locale: "es-CA" }); const p = await c.newPage(); const err = [];
                p.on("pageerror", (e) => err.push(e.message));
                const resp = await p.goto(process.env.BASE + r, { waitUntil: "networkidle" });
                const h1 = await p.locator("h1").first().innerText().catch(() => "");
                const sw = await p.evaluate(() => document.documentElement.scrollWidth - document.documentElement.clientWidth);
                console.log("PAG|", n, resp.status(), r, "|", h1.replace(/\s+/g, " ").slice(0, 70), "| errores JS:", err.length, "| desborde:", sw);
                await c.close();
              }
            }
            await b.close();
          })();'
      - name: contadores después
        run: for id in ART-2026-029 ART-2026-030; do echo "DESPUES|$id|$(curl -fsS "$BASE/api/vistas/$id")"; done
