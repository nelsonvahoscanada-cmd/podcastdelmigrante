name: tmp verificar BC en produccion
on:
  push:
    branches: [claude/laughing-albattani-1rvkc1]
    paths: [".github/workflows/tmp-verificar-produccion-bc.yml"]
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      BASE: https://podcastdelmigrante.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-save playwright@1 && npx playwright install --with-deps chromium
      - run: node .github/tmp/zonas.cjs
      - name: Desafío y BC con detalle
        run: |
          for t in desafio british-columbia-localidades; do
            NODE_OPTIONS="--require ./.github/tmp/sin-visitas.cjs" node tests/e2e-$t.cjs > r.txt 2>&1 && echo "R|OK|$t" || { echo "R|FALLA|$t"; tail -40 r.txt; }
          done
      - name: contadores después
        run: for id in ART-2026-029 ART-2026-030; do echo "DESPUES|$id|$(curl -fsS "$BASE/api/vistas/$id")"; done
