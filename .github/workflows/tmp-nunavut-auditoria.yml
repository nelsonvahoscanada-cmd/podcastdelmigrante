name: tmp nunavut auditoria
on:
  push:
    branches: [claude/laughing-albattani-1rvkc1-nunavut-auditoria]
    paths: [".github/workflows/tmp-nunavut-auditoria.yml"]
permissions:
  contents: write
jobs:
  auditoria:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: mkdir -p /tmp/out /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.48.0 axe-core@4.10.2 lighthouse@12.2.1 >/dev/null && npx playwright install --with-deps chromium >/dev/null && pip install -q playwright==1.48.0 && python -m playwright install chromium >/dev/null
      - name: Datos y fuentes oficiales actuales
        continue-on-error: true
        run: python3 .github/auditoria-nu/datos.py > /tmp/out/datos.txt 2>&1; tail -5 /tmp/out/datos.txt
      - name: Enlaces externos
        continue-on-error: true
        run: python3 scripts/canada-en-datos/verificar-enlaces-nu.py > /tmp/out/enlaces.txt 2>&1; tail -15 /tmp/out/enlaces.txt
      - name: Diseño, interacción y accesibilidad (axe)
        continue-on-error: true
        env: { NODE_PATH: /tmp/pw/node_modules, OUT: /tmp/out }
        run: node .github/auditoria-nu/visual.cjs > /tmp/out/visual.txt 2>&1; cat /tmp/out/visual.txt | tail -40
      - name: Lighthouse (sin contar visitas)
        continue-on-error: true
        run: |
          export CHROME_PATH=$(node -e 'console.log(require("/tmp/pw/node_modules/playwright").chromium.executablePath())')
          for r in canada-en-datos/nunavut canada-en-datos/nunavut/iqaluit canada-en-datos/alberta; do
            for m in mobile desktop; do
              n=$(echo $r | tr / -)-$m; extra=""; [ $m = desktop ] && extra="--preset=desktop"
              /tmp/pw/node_modules/.bin/lighthouse "https://podcastdelmigrante.com/$r" $extra --blocked-url-patterns='*/api/vistas*' --blocked-url-patterns='*/api/events*' --chrome-flags="--headless=new --no-sandbox" --output=json --output-path=/tmp/out/lh-$n.json --quiet || true
              node -e 'const r=require(process.argv[1]);const c=r.categories;const a=r.audits;console.log(process.argv[2], Object.entries(c).map(([k,v])=>k+":"+Math.round(v.score*100)).join(" "), "| LCP", a["largest-contentful-paint"].displayValue, "| CLS", a["cumulative-layout-shift"].displayValue, "| TBT", a["total-blocking-time"].displayValue, "| peso", a["total-byte-weight"].displayValue);for(const [k,v] of Object.entries(a)){if(v.score!==null&&v.score<0.9&&["performance","accessibility","seo","best-practices"].some(x=>c[x].auditRefs.some(y=>y.id===k&&y.weight>0)))console.log("   ",k,v.score,v.displayValue||"")}' /tmp/out/lh-$n.json $n >> /tmp/out/lighthouse.txt 2>&1 || echo "$n sin resultado" >> /tmp/out/lighthouse.txt
              rm -f /tmp/out/lh-$n.json
            done
          done
          cat /tmp/out/lighthouse.txt
      - name: Publicar
        if: always()
        run: |
          cd /tmp/out && git init -q -b datos && git config user.name datos && git config user.email datos@users.noreply.github.com && git add -A && git commit -qm "Auditoria nunavut [CF-Pages-Skip]"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" datos:refs/heads/claude/laughing-albattani-1rvkc1-nunavut-auditoria-datos
