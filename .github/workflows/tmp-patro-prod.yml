name: tmp patrocinador produccion
on:
  push:
    branches: [claude/laughing-albattani-1rvkc1-patrocinador]
    paths: [".github/workflows/tmp-patro-prod.yml"]
permissions:
  contents: write
jobs:
  produccion:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Esperar el despliegue de produccion
        run: for i in $(seq 1 60); do curl -s https://podcastdelmigrante.com/js/data.js | grep -q 'country-hills-toyota.png' && echo listo && exit 0; sleep 20; done; exit 1
      - run: mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.48.0 >/dev/null && npx playwright install --with-deps chromium >/dev/null
      - name: Simulador del contador y sin Web Analytics (no genera visitas)
        run: |
          cat > /tmp/pw/vistas.cjs <<'JS'
          const pw = require("/tmp/pw/node_modules/playwright");
          const orig = pw.chromium.launch.bind(pw.chromium);
          pw.chromium.launch = async (...a) => {
            const b = await orig(...a);
            const nc = b.newContext.bind(b);
            b.newContext = async (...o) => { const c = await nc(...o); await c.route(/\/api\/(vistas|events)/, (r) => r.fulfill({ status: 200, contentType: "application/json", body: '{"ok":true,"vistas":0}' })); return c; };
            b.newPage = async (...o) => { const c = await b.newContext(...o); return c.newPage(); };
            return b;
          };
          JS
      - name: Archivos publicados y logo identico al original
        run: |
          B=https://podcastdelmigrante.com
          for f in assets/patrocinadores/country-hills-toyota.png js/data.js js/main.js css/styles.css; do curl -sfL "$B/$f" -o /tmp/x; if cmp -s /tmp/x "$f"; then echo "IGUAL $f"; else echo "DISTINTO $f"; fi; done
          echo "sha256 logo publicado: $(curl -sf $B/assets/patrocinadores/country-hills-toyota.png | sha256sum)"
      - name: E2E en produccion
        env:
          BASE: https://podcastdelmigrante.com
          SHOTS: /tmp/out
          NODE_PATH: /tmp/pw/node_modules
          NODE_OPTIONS: --require /tmp/pw/vistas.cjs
        run: |
          mkdir -p /tmp/out; r=0
          for t in noticias alberta-bomberos; do echo "=== $t"; node tests/e2e-$t.cjs 2>&1 | tail -12 | tee -a /tmp/out/resultado.txt || r=1; done
          ls /tmp/out
      - name: Publicar capturas en la rama de datos
        if: always()
        run: |
          cd /tmp/out && git init -q -b datos && git config user.name "datos" && git config user.email "datos@users.noreply.github.com"
          git add -A && git commit -qm "Capturas de patrocinadores en produccion [CF-Pages-Skip]"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" datos:refs/heads/claude/laughing-albattani-1rvkc1-patro-capturas3
