# TEMPORAL: verificar en producción el PR #125 (solo lectura; sin estadísticas). Se elimina después.
name: tmp noticias prod
on:
  push:
    branches: [claude/noticias-html-prod]
permissions:
  contents: write
jobs:
  verificar:
    runs-on: ubuntu-latest
    env:
      BASE: https://podcastdelmigrante.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Esperar el despliegue del commit fusionado (máx. 20 min)
        run: |
          V=$(sha256sum js/article.js | cut -c1-10)
          for i in $(seq 120); do
            curl -fsS "$BASE/articulo-canada-cambios-proceso-refugio-3-noviembre-2026?nc=$i$RANDOM" | grep -q "js/article.js?v=$V" && { echo "desplegado (intento $i, article.js v=$V)"; exit 0; }
            sleep 10
          done; exit 1
      - run: mkdir -p /tmp/out /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i -s playwright && npx playwright install --with-deps chromium >/dev/null
      - name: Fechas, HTML completo y noticia nueva simulada
        if: always()
        run: python3 tmp-prod/fechas-y-nueva.py
      - name: Suites e2e contra producción (sin estadísticas)
        if: always()
        run: |
          set +e
          for t in noticias-html seo-redirecciones residencias-33000 suplemento-alimentos refugio-2026 elmy-salud-rural entre-dos-mundos-cap2 carlos-noviembre cgeb express-entry-150 alquiler-alberta masterclass-eder-campos hector-rivero multas-representantes alberta-bomberos empleo-remoto-alberta noticias; do
            r=$(NODE_PATH=/tmp/pw/node_modules NODE_OPTIONS="--require $PWD/tmp-prod/sin-estadisticas.cjs" timeout 900 node tests/e2e-$t.cjs 2>&1); c=$?
            echo "$t: $c $(echo "$r" | grep -m1 -E '^OK|Error|assert' | cut -c1-300)" | tee -a /tmp/out/e2e.txt
            [ $c -ne 0 ] && echo "$r" | tail -30 > /tmp/out/fallo-$t.txt
          done
          # Patrocinadores: la prueba intercepta ella misma /api/events (no llega a las estadísticas); el resto de /api/* se responde localmente
          r=$(NODE_PATH=/tmp/pw/node_modules NODE_OPTIONS="--require $PWD/tmp-prod/solo-api.cjs" timeout 900 node tests/e2e-patrocinadores.cjs 2>&1); c=$?
          echo "patrocinadores: $c $(echo "$r" | grep -m1 -E '^OK|Error|assert' | cut -c1-300)" | tee -a /tmp/out/e2e.txt
          [ $c -ne 0 ] && echo "$r" | tail -30 > /tmp/out/fallo-patrocinadores.txt
          true
      - name: Publicar
        if: always()
        run: |
          cd /tmp/out && git init -q -b datos && git config user.name datos && git config user.email datos@users.noreply.github.com && git add -A && git commit -qm "prod [CF-Pages-Skip]"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" datos:refs/heads/claude/noticias-html-prod-datos
