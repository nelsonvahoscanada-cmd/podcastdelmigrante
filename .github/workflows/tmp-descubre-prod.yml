name: tmp descubre produccion
on:
  push:
    branches: [claude/laughing-albattani-1rvkc1-descubre]
    paths: [".github/workflows/tmp-descubre-prod.yml"]
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        prueba: [e2e-noticias]
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Esperar el despliegue de produccion (Quebec y el texto del PEQ)
        run: for i in $(seq 1 60); do curl -s https://podcastdelmigrante.com/ | grep -q 'id="descubre-tu-canada"' && echo listo && exit 0; sleep 20; done; exit 1
      - run: mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.48.0 >/dev/null && npx playwright install --with-deps chromium >/dev/null
      - name: Simulador del contador (solo lectura; no genera visitas en producción)
        run: |
          cat > /tmp/pw/vistas.cjs <<'JS'
          const pw = require("/tmp/pw/node_modules/playwright");
          const orig = pw.chromium.launch.bind(pw.chromium);
          pw.chromium.launch = async (...a) => {
            const b = await orig(...a);
            const nc = b.newContext.bind(b);
            b.newContext = async (...o) => { const c = await nc(...o); await c.route(/\/api\/(vistas|events)/, (r) => r.fulfill({ status: 200, contentType: "application/json", body: '{"ok":true,"vistas":0}' })); return c; };
            const np = b.newPage.bind(b);
            b.newPage = async (...o) => { const c = await b.newContext(...o); return c.newPage(); };
            return b;
          };
          JS
      - name: Web Analytics en el navegador (cuantas veces y como)
        run: |
          cat > /tmp/diag.cjs <<'JS'
          const { chromium } = require("playwright");
          (async () => {
            const b = await chromium.launch();
            for (const ruta of ["/", "/canada-en-datos/", "/canada-en-datos/quebec/montreal", "/noticias", "/articulo-alberta-empleo-desde-casa-program-eligibility-assessor-2026", "/quien-puede-ayudarte", "/perfil-carlos-d-castillo"]) {
              const p = await b.newPage();
              const rum = []; const beacon = [];
              p.on("request", (r) => { const u = r.url(); if (/cloudflareinsights|\/cdn-cgi\/rum/.test(u)) (u.includes("/rum") ? rum : beacon).push(r.method() + " " + u.replace(/\?.*/, "")); });
              await p.goto("https://podcastdelmigrante.com" + ruta, { waitUntil: "load" });
              await p.waitForTimeout(6000);
              const info = await p.evaluate(() => [...document.querySelectorAll("script[src*='cloudflareinsights'], script[data-cf-beacon]")].map((s) => ({ src: s.src.replace(/\?.*/, ""), beacon: (s.getAttribute("data-cf-beacon") || "").replace(/"token":"[^"]{6}([^"]*)"/, '"token":"…$1"') })));
              console.log(ruta, "| scripts en el DOM:", info.length, JSON.stringify(info), "| cargas del script:", beacon.length, "| envios RUM:", rum.length, rum.slice(0, 2).join(" "));
              await p.close();
            }
            await b.close();
          })();
          JS
          node /tmp/diag.cjs
          echo "=== HTML pedido como navegador (Accept: text/html) ==="
          curl -s -H 'Accept: text/html' -A 'Mozilla/5.0 (X11; Linux x86_64) Chrome/130' https://podcastdelmigrante.com/ | grep -o '<script[^>]*cloudflareinsights[^>]*>' | sed 's/"token":"[^"]*"/"token":"(oculto)"/' 
        env:
          NODE_PATH: /tmp/pw/node_modules
          NODE_OPTIONS: --require /tmp/pw/vistas.cjs
      - run: node tests/${{ matrix.prueba }}.cjs
        env:
          BASE: https://podcastdelmigrante.com
          NODE_PATH: /tmp/pw/node_modules
          NODE_OPTIONS: --require /tmp/pw/vistas.cjs
  sitio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Esperar el despliegue de produccion (Quebec y el texto del PEQ)
        run: for i in $(seq 1 60); do curl -s https://podcastdelmigrante.com/ | grep -q 'id="descubre-tu-canada"' && echo listo && exit 0; sleep 20; done; exit 1
      - name: Diferencias de index.html servidos frente al repositorio
        run: |
          B=https://podcastdelmigrante.com
          for f in index.html canada-en-datos/index.html; do
            echo "=== $f"; curl -sfL "$B/$f" -o /tmp/x; diff "$f" /tmp/x | head -30 || true
          done
