name: tmp verificar BC
on:
  push:
    branches: [claude/laughing-albattani-1rvkc1]
    paths: [".github/workflows/tmp-verificar-bc.yml"]
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      BASE: https://1bebed26.podcastdelmigrante.pages.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-save playwright@1 && npx playwright install --with-deps chromium
      - run: mkdir -p shots && SHOTS=shots node tests/e2e-british-columbia-localidades.cjs
      - if: always()
        run: for t in alberta-localidades ontario-localidades canada-datos noticias menu; do node tests/e2e-$t.cjs > r.txt 2>&1 && echo "R|OK|$t|$(tail -1 r.txt)" || { echo "R|FALLA|$t"; tail -20 r.txt; }; done
      - if: always()
        run: |
          for t in "/canada-en-datos/british-columbia" "/canada-en-datos/british-columbia/vancouver"; do curl -sI "$BASE$t" | grep -i "^HTTP\|x-robots" | sed "s#^#H|$t|#"; done
          ls -la shots
          for f in shots/*.png; do convert "$f" -resize '1000x6000>' -quality 70 "${f%.png}.jpg"; echo "F|${f%.png}.jpg"; gzip -c "${f%.png}.jpg" | base64 -w0 | fold -w 4000 | sed 's/^/C|/'; echo; done
