# TEMPORAL — Día 3 de privacidad. Se elimina al terminar la revisión.
#
# Consulta los datos públicos (oEmbed) de los videos de YouTube del sitio
# —título y canal— y descarga sus miniaturas SOLO para revisión, en la
# rama temporal tmp/revision-miniaturas-yt (no se publica: el commit
# lleva [CF-Pages-Skip] [skip ci] y la rama no se fusiona nunca).
#
# Solo se ejecuta a mano (workflow_dispatch). Sin secretos ni tokens
# adicionales: usa el GITHUB_TOKEN temporal del propio proceso.
#   accion = revisar  → informe + rama temporal con las miniaturas
#   accion = limpiar  → borra la rama temporal
name: "TEMPORAL: revisión de miniaturas de YouTube"

on:
  workflow_dispatch:
    inputs:
      accion:
        description: "revisar o limpiar"
        required: true
        default: revisar
        type: choice
        options: [revisar, limpiar]

permissions: {}

concurrency:
  group: revision-miniaturas-yt
  cancel-in-progress: false

env:
  RAMA: tmp/revision-miniaturas-yt
  VIDEOS: >-
    O5on_J9cRb4 AnAZeaE7LV4 z2Ih590xSP4 3tOZfCwZWN8 ENyFwvkj8W0 jw0cYzjV35U
    M7JFiyvPDT8 0rFRBV7wYqM 2RcMF0Uiz2Y xJaXI3r83sA bDhX_XW2bE0 UloNyWGYEXo
    oqfNbzC_OLA 6YdTsBzG2gs UsWWtkmnszw EEqjez0MuAY

jobs:
  revisar:
    if: inputs.accion == 'revisar'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # solo para crear la rama temporal de revisión
    steps:
      - name: Consultar datos públicos y descargar miniaturas
        shell: python3 {0}
        run: |
          import hashlib, json, os, pathlib, struct, urllib.error, urllib.parse, urllib.request
          out = pathlib.Path("revision"); out.mkdir()
          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read()
          def jpeg_size(b):
              i = 2
              while i < len(b):
                  if b[i] != 0xFF: i += 1; continue
                  m = b[i + 1]
                  if m in (0xC0, 0xC1, 0xC2):
                      h, w = struct.unpack(">HH", b[i + 5:i + 9]); return w, h
                  i += 2 + struct.unpack(">H", b[i + 2:i + 4])[0]
              return 0, 0
          rows = []
          for vid in os.environ["VIDEOS"].split():
              row = {"id": vid}
              try:
                  meta = json.loads(get("https://www.youtube.com/oembed?format=json&url=" + urllib.parse.quote("https://www.youtube.com/watch?v=" + vid)))
                  row.update(titulo=meta.get("title"), canal=meta.get("author_name"), canal_url=meta.get("author_url"))
              except urllib.error.HTTPError as e:
                  row.update(error_oembed=e.code)
              for size in ("maxresdefault", "sddefault", "hqdefault"):
                  try:
                      data = get(f"https://i.ytimg.com/vi/{vid}/{size}.jpg")
                  except urllib.error.HTTPError:
                      continue
                  w, h = jpeg_size(data)
                  if w <= 120:
                      continue
                  (out / f"{vid}.jpg").write_bytes(data)
                  row.update(miniatura=size, ancho=w, alto=h, kb=len(data) // 1024, sha256=hashlib.sha256(data).hexdigest())
                  break
              rows.append(row)
              print(json.dumps(row, ensure_ascii=False))
          (out / "informe.json").write_text(json.dumps(rows, ensure_ascii=False, indent=1))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as s:
              s.write("| Video | Canal | Título | Miniatura |\n|---|---|---|---|\n")
              for r in rows:
                  s.write(f"| {r['id']} | {r.get('canal') or 'NO VERIFICADO (' + str(r.get('error_oembed')) + ')'} | {r.get('titulo') or ''} | {r.get('miniatura', 'sin miniatura')} {r.get('ancho', '')}×{r.get('alto', '')} |\n")

      - name: Guardar en la rama temporal de revisión (no se publica)
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd revision
          git init -q -b revision
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Revisión temporal de miniaturas (no publicar) [CF-Pages-Skip] [skip ci]"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${RAMA}"

  limpiar:
    if: inputs.accion == 'limpiar'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write   # solo para borrar la rama temporal
    steps:
      - name: Borrar la rama temporal
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q limpieza && cd limpieza
          URL="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code "$URL" "refs/heads/${RAMA}" >/dev/null; then
            git push "$URL" --delete "${RAMA}"
          else
            echo "La rama ya no existe."
          fi
          if git ls-remote --exit-code "$URL" "refs/heads/${RAMA}" >/dev/null; then
            echo "::error::La rama ${RAMA} sigue existiendo"; exit 1
          fi
          echo "Rama ${RAMA} borrada."
