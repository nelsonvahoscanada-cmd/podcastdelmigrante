# TEMPORAL: verificar en producción el PR #138 (solo lectura; sin estadísticas). Se elimina después.
name: tmp santa galeria prod
on:
  push:
    branches: [claude/santa-latino-galeria-prod]
permissions:
  contents: write
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      P: https://podcastdelmigrante.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Esperar el despliegue en producción (máx. 20 min)
        run: |
          for i in $(seq 120); do
            curl -fsS "$P/perfil-santa-latino?nc=$i$RANDOM" | grep -q 'santa-latino-evento-regalos' && { echo "desplegado (intento $i)"; exit 0; }
            sleep 10
          done; exit 1
      - name: Archivos servidos frente al repositorio (solo GET de archivos estáticos)
        if: always()
        run: |
          mkdir -p /tmp/out; o=/tmp/out/archivos.txt
          for f in assets/directorio/perfiles/santa-latino-evento-escenario.jpg assets/directorio/perfiles/santa-latino-evento-regalos.jpg assets/directorio/perfiles/santa-latino-principal-navidad.jpg assets/directorio/perfiles/santa-latino-og-navidad.jpg assets/directorio/perfiles/santa-latino-card.jpg css/temas/navidad.css $(git ls-files 'assets/qr/*' 'vcard/*'); do
            curl -fsS "$P/$f?nc=$RANDOM" -o /tmp/f && cmp -s /tmp/f "$f" && echo "igual $f" || echo "DISTINTO $f"
          done >> $o
          echo "foto anterior: $(curl -s -o /dev/null -w '%{http_code}' "$P/assets/directorio/perfiles/santa-latino-navidad-grupo.jpg")" >> $o
          echo "GET /api/events: $(curl -s -o /dev/null -w '%{http_code}' "$P/api/events")" >> $o
          for h in $(git ls-files 'perfil-*.html'); do
            u=/${h%.html}; curl -fsS "$P$u?nc=$RANDOM" -o /tmp/h || { echo "ERROR $u" >> $o; continue; }
            n=$(diff <(grep -v -e 'email-decode' -e 'email-protection' -e 'js/data.js' "$h") <(grep -v -e 'email-decode' -e 'email-protection' -e 'js/data.js' /tmp/h) | grep -c '^[<>]')
            echo "$u: $n líneas distintas (fuera de la protección de correos de Cloudflare)" >> $o
          done
          cat $o
      - run: mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i -s playwright && npx playwright install --with-deps chromium >/dev/null
      - name: E2E en producción (estadísticas bloqueadas)
        if: always()
        run: |
          r=0
          for t in santa-latino-galeria santa-latino nelson-vahos; do
            BASE=$P SHOTS=/tmp/out NODE_PATH=/tmp/pw/node_modules NODE_OPTIONS="--require $PWD/tmp-prod/sin-estadisticas.cjs" node tests/e2e-$t.cjs 2>&1 | grep -v "^\s*at " | tail -40 | tee /tmp/out/e2e-$t.txt; [ ${PIPESTATUS[0]} = 0 ] || r=1
          done; exit $r
      - name: Publicar
        if: always()
        run: |
          cd /tmp/out && git init -q -b datos && git config user.name datos && git config user.email datos@users.noreply.github.com && git add -A && git commit -qm "producción galería Santa Latino [CF-Pages-Skip]"
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" datos:refs/heads/claude/santa-latino-galeria-prod-datos-${{ github.run_number }}
