# TEMPORAL: verificar en producción el PR #138 (solo lectura; sin estadísticas). Se elimina después.
name: tmp santa galeria prod
on:
  push:
    branches: [claude/santa-latino-galeria-prod]
permissions:
  contents: write
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      P: https://podcastdelmigrante.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Detalle (solo lectura)
        if: always()
        run: |
          mkdir -p /tmp/out; o=/tmp/out/detalle.txt
          { echo "### foto anterior"; curl -sS -D - -o /tmp/vieja "$P/assets/directorio/perfiles/santa-latino-navidad-grupo.jpg?nc=$RANDOM" | grep -i -E '^(HTTP|content-type|content-length|cf-cache-status|age|location)'; file /tmp/vieja; head -c 300 /tmp/vieja | strings | head -5
            echo "### sin parámetro"; curl -sS -D - -o /dev/null "$P/assets/directorio/perfiles/santa-latino-navidad-grupo.jpg" | grep -i -E '^(HTTP|content-type|cf-cache-status|age)'
            echo "### otra ruta inexistente"; curl -sS -D - -o /dev/null "$P/assets/directorio/perfiles/no-existe-xyz.jpg" | grep -i -E '^(HTTP|content-type)'
            for h in perfil-santa-latino.html perfil-tomas-velazquez.html; do
              echo "### diff $h"; curl -fsS "$P/${h%.html}?nc=$RANDOM" -o /tmp/h
              diff <(grep -v -e 'email-decode' -e 'email-protection' -e 'js/data.js' "$h") <(grep -v -e 'email-decode' -e 'email-protection' -e 'js/data.js' /tmp/h) | cut -c1-300
            done; } > $o 2>&1
          cat $o
      - name: Publicar
        if: always()
        run: |
          cd /tmp/out && git init -q -b datos && git config user.name datos && git config user.email datos@users.noreply.github.com && git add -A && git commit -qm "producción galería Santa Latino [CF-Pages-Skip]"
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" datos:refs/heads/claude/santa-latino-galeria-prod-datos-${{ github.run_number }}
