# TEMPORAL — solo en la rama claude/canada-en-datos. Consulta de solo lectura
# de fuentes oficiales (Statistics Canada, alberta.ca, canada.ca, CMHC) para
# verificar las cifras y los textos de «Canadá en Datos». Sin secretos ni
# permisos de escritura. Se elimina de la rama después de usarse: no debe
# llegar a main.
name: "Canadá en Datos: consulta de fuentes oficiales"
on:
  push:
    branches: [claude/canada-en-datos]
    paths:
      - scripts/canada-en-datos/consultar-*
      - .github/workflows/canada-datos-fuentes.yml
permissions:
  contents: read
jobs:
  tablas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install openpyxl
      - run: python3 scripts/canada-en-datos/consultar-tablas.py
