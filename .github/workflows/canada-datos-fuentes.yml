# TEMPORAL — solo en la rama claude/canada-en-datos. Consulta de solo lectura
# de las tablas oficiales de Statistics Canada. Sin secretos ni permisos de
# escritura. Se elimina de la rama antes del merge: no debe llegar a main.
name: "Canadá en Datos: consulta de fuentes oficiales"
on:
  push:
    branches: [claude/canada-en-datos]
    paths:
      - .github/workflows/canada-datos-fuentes.yml
permissions:
  contents: read
jobs:
  statcan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/canada-en-datos/consultar-statcan.py
