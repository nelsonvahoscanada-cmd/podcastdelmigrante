# TEMPORAL: verificar en producción la noticia del suplemento de alimentos (solo lectura; sin TikTok ni estadísticas). Se elimina después.
name: verificar-alimentos
on:
  push:
    branches: [claude/laughing-albattani-1rvkc1-alimentos-prod]
permissions:
  contents: read
jobs:
  prod:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://podcastdelmigrante.com; S=canada-suplemento-alimentos-679-presupuesto-2026
          for i in $(seq 1 40); do curl -s "$B/js/data.js?t=$RANDOM" | grep -q "$S" && { echo "desplegado (intento $i)"; break; }; if [ $i = 40 ]; then exit 1; fi; sleep 15; done
          curl -s -o a.html -w "articulo: %{http_code}\n" "$B/articulo-$S"
          grep -o '<title>[^<]*</title>' a.html; grep -oE '(property|name)="(og:title|og:description|og:image|og:url|twitter:image|article:published_time)" content="[^"]*"' a.html
          curl -s -A 'facebookexternalhit/1.1' "$B/articulo-$S" | grep -oE 'property="og:(title|image)" content="[^"]*"'
          curl -s -A 'WhatsApp/2.23' "$B/articulo-$S" | grep -oE 'property="og:(title|image)" content="[^"]*"'
          curl -s -o /dev/null -w "imagen social: %{http_code} %{content_type} %{size_download}\n" "$B/assets/social/$S.jpg"
          curl -s -o /dev/null -w "imagen portada: %{http_code} %{content_type} %{size_download}\n" "$B/assets/$S.jpg"
          curl -s "$B/sitemap.xml" | grep -c "$S" | sed 's/^/sitemap: /'
          mkdir v && cd v && npm init -y >/dev/null && npm i -s playwright@1.49.1 >/dev/null && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > v.cjs <<'JS'
          const { chromium, devices } = require("playwright");
          const B = "https://podcastdelmigrante.com", S = "canada-suplemento-alimentos-679-presupuesto-2026", V = "7706353073295297813";
          const OF = ["https://www.canada.ca/en/revenue-agency/services/child-family-benefits/canada-groceries-essentials-benefit.html", "https://www.canada.ca/en/revenue-agency/services/child-family-benefits/canada-groceries-essentials-benefit/who-eligible.html", "https://www.canada.ca/en/revenue-agency/services/child-family-benefits/canada-groceries-essentials-benefit/get-benefit.html", "https://www.canada.ca/en/revenue-agency/services/forms-publications/forms/rc151.html", "https://budget.canada.ca/2026/report-rapport/chap3-en.html"];
          (async () => { const br = await chromium.launch(); let f = 0; const ok = (c, m) => { console.log((c ? "OK   " : "FALLA") + " " + m); if (!c) f++; };
            for (const [n, p] of [["computador", { viewport: { width: 1440, height: 900 } }], ["celular", devices["iPhone 13"]]]) {
              const ctx = await br.newContext(p); const tk = [];
              await ctx.route(/\/api\/(vistas|events)/, (r) => r.fulfill({ status: 204, body: "" }));
              await ctx.route((u) => /tiktok/.test(u.hostname), (r) => { tk.push(r.request().url()); r.abort(); });
              const pg = await ctx.newPage(); const err = []; pg.on("pageerror", (e) => err.push(e.message));
              await pg.goto(B + "/", { waitUntil: "networkidle" });
              ok(/^Canadá propone hasta \$679 adicionales/.test((await pg.locator("#heroMain h1").innerText()).trim()), `${n} noticia principal (posición 1) en portada`);
              ok(/canada-suplemento-alimentos-679-presupuesto-2026\.jpg/.test(await pg.locator("#heroMain .hero-main__media").getAttribute("style")), `${n} imagen en la portada`);
              const t = await pg.locator("#heroSecondary .hero-sec-card h2").allInnerTexts(); console.log("     tarjetas:", JSON.stringify(t.map((x) => x.slice(0, 45))));
              ok(t.length === 5 && /alquiler/.test(t[0]), `${n} anteriores desplazadas (alquiler en la 1.ª tarjeta)`);
              await pg.goto(B + "/articulo-" + S, { waitUntil: "networkidle" });
              const txt = await pg.locator("main").innerText();
              ok(["Hasta $679 CAD para una pareja con dos hijos.", "Hasta $339 CAD para una persona soltera sin hijos.", "todavía es una propuesta presupuestaria", "principios de 2027", "No existe una solicitud específica abierta", "No constituyen una inscripción al suplemento extraordinario de $679.", "Nota editorial", "Finanzas"].every((x) => txt.includes(x)), `${n} artículo completo con avisos`);
              ok(await pg.evaluate(() => { const v = document.querySelector(".article-video--tiktok"); return !!v && v.nextElementSibling && v.nextElementSibling.textContent.includes("¿Cuánto dinero adicional"); }), `${n} video tras la introducción`);
              ok((await pg.locator(".article-tiktok iframe").count()) === 0 && tk.length === 0, `${n} sin autoplay ni conexión a TikTok al abrir`);
              ok((await pg.locator(".article-tiktok__link").getAttribute("href")) === `https://www.tiktok.com/@podcastdelmigrante/video/${V}`, `${n} enlace del video`);
              await pg.locator(".article-tiktok__play").scrollIntoViewIfNeeded(); await pg.locator(".article-tiktok__play").click();
              ok(new RegExp(`tiktok\\.com/player/v1/${V}`).test(await pg.locator(".article-tiktok iframe").getAttribute("src")), `${n} reproductor oficial al pulsar`);
              ok(await pg.locator(".article-hero-media").evaluate((m) => /canada-suplemento-alimentos-679-presupuesto-2026\.jpg/.test(m.getAttribute("style"))), `${n} imagen principal del artículo`);
              let enl = true; for (const u of OF) enl = enl && (await pg.locator(`.article-body a[href="${u}"]`).count()) >= 1; ok(enl, `${n} cinco enlaces oficiales`);
              const pub = await pg.locator("aside.article-patrocinio").innerText(); ok(/publicidad/i.test(pub) && /Toyota Country Hills/.test(pub) && /sujeta a confirmación/.test(pub), `${n} patrocinio separado y condicionado`);
              const [sw, cw] = await pg.evaluate(() => [document.documentElement.scrollWidth, document.documentElement.clientWidth]); ok(sw <= cw + 1, `${n} sin desplazamiento horizontal`);
              ok(err.length === 0, `${n} sin errores JS ${JSON.stringify(err)}`);
              await pg.goto(B + "/noticias.html", { waitUntil: "networkidle" });
              ok((await pg.locator(`main a[href*="${S}"]`).count()) > 0, `${n} en el listado de noticias`);
              await ctx.close();
            } await br.close(); process.exit(f ? 1 : 0); })();
          JS
          node v.cjs
