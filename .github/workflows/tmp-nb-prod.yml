# TEMPORAL: verificar en producción el PR #136 (solo lectura; sin estadísticas). Se elimina después.
name: tmp nb prod
on:
  push:
    branches: [claude/canada-datos-nb-prod]
permissions:
  contents: write
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      P: https://podcastdelmigrante.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Esperar el despliegue en producción (máx. 20 min)
        run: |
          for i in $(seq 120); do
            curl -fsS "$P/canada-en-datos/new-brunswick?nc=$i$RANDOM" | grep -q 'Explora las ciudades y pueblos de Nuevo Brunswick' && { echo "desplegado (intento $i)"; exit 0; }
            sleep 10
          done; exit 1
      - name: Estados HTTP, mapa y archivos servidos
        if: always()
        run: |
          mkdir -p /tmp/out
          {
            echo "--- Nuevo Brunswick"
            for u in /canada-en-datos/new-brunswick /canada-en-datos/new-brunswick/moncton /canada-en-datos/new-brunswick/saint-john /canada-en-datos/new-brunswick/fredericton /canada-en-datos/new-brunswick/dieppe /canada-en-datos/new-brunswick/riverview /canada-en-datos/new-brunswick/miramichi /canada-en-datos/new-brunswick/edmundston /canada-en-datos/new-brunswick/bathurst /canada-en-datos/new-brunswick/campbellton /canada-en-datos/new-brunswick/moncton-parish /canada-en-datos/new-brunswick/shediac /assets/canada-en-datos/social-new-brunswick.jpg /assets/canada-en-datos/new-brunswick/moncton.jpg /js/new-brunswick-localidades.js /assets/canada-en-datos/new-brunswick-regiones.svg; do printf "%-60s %s\n" "$u" "$(curl -s -o /dev/null -w '%{http_code}' "$P$u")"; done
            echo "--- Demás provincias y territorios (guía y una localidad)"
            for u in /canada-en-datos/ /canada-en-datos/alberta /canada-en-datos/alberta/brooks /canada-en-datos/british-columbia /canada-en-datos/british-columbia/vancouver /canada-en-datos/saskatchewan /canada-en-datos/manitoba /canada-en-datos/ontario /canada-en-datos/ontario/toronto /canada-en-datos/quebec /canada-en-datos/prince-edward-island /canada-en-datos/prince-edward-island/charlottetown /canada-en-datos/yukon /canada-en-datos/northwest-territories /canada-en-datos/nunavut; do printf "%-60s %s\n" "$u" "$(curl -s -o /dev/null -w '%{http_code}' "$P$u")"; done
            echo "--- Mapa: Nuevo Brunswick como ficha disponible"
            curl -s "$P/canada-en-datos/" | grep -o 'class="cd-region[^"]*" data-code="NB"[^>]*' | head -2
            curl -s "$P/canada-en-datos/" | grep -o 'Nuevo Brunswick ([^)]*)' | head -2
            echo "--- Archivos servidos = repositorio"
            for f in js/new-brunswick-localidades.js js/canada-datos.js js/canada-datos-disponibles.js assets/canada-en-datos/social-new-brunswick.jpg assets/canada-en-datos/descubre-mapa.svg; do echo "$f: $(curl -s "$P/$f" | cmp -s - $f && echo idéntico || echo DIFERENTE)"; done
            echo "--- Sitemap"
            curl -s "$P/sitemap.xml" | grep -c "canada-en-datos/new-brunswick"
          } 2>&1 | tee /tmp/out/estados.txt
      - name: Enlaces externos de la guía
        if: always()
        continue-on-error: true
        run: pip install -q playwright && python -m playwright install --with-deps chromium >/dev/null && python .github/enlaces/verificar-nb.py > /tmp/out/enlaces.log 2>&1; grep -vE "^200 |^NAV 200 " /tmp/out/enlaces.txt > /tmp/out/enlaces-no200.txt; wc -l < /tmp/out/enlaces.txt; cat /tmp/out/enlaces-no200.txt
      - run: mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i -s playwright && npx playwright install --with-deps chromium >/dev/null
      - name: E2E en producción (estadísticas bloqueadas)
        if: always()
        run: |
          r=0
          for t in new-brunswick-localidades descubre-canada prince-edward-island-localidades yukon-localidades alberta-localidades quebec-localidades canada-datos; do
            BASE=$P SHOTS=/tmp/out NODE_PATH=/tmp/pw/node_modules NODE_OPTIONS="--require $PWD/tmp-prod/sin-estadisticas.cjs" node tests/e2e-$t.cjs 2>&1 | grep -v "^\s*at " | grep -v "waiting\|element is not stable\|retrying" | tail -14 | tee /tmp/out/e2e-$t.txt; [ ${PIPESTATUS[0]} = 0 ] || r=1
          done; exit $r
      - name: Publicar
        if: always()
        run: |
          cd /tmp/out && git init -q -b datos && git config user.name datos && git config user.email datos@users.noreply.github.com && git add -A && git commit -qm "producción Nuevo Brunswick [CF-Pages-Skip]"
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" datos:refs/heads/claude/canada-datos-nb-prod-datos-${{ github.run_number }}
