# TEMPORAL: verificar la vista previa del PR #131 (solo lectura; sin estadísticas). Se elimina después.
name: tmp santa og vista previa
on:
  push:
    branches: [claude/santa-latino-og-vista]
permissions:
  contents: write
jobs:
  verificar:
    runs-on: ubuntu-latest
    env:
      P: https://claude-santa-latino-og.podcastdelmigrante.pages.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Esperar la vista previa (máx. 15 min)
        run: |
          for i in $(seq 90); do
            curl -fsS "$P/perfil-santa-latino?nc=$i$RANDOM" | grep -q 'santa-latino-og-navidad.jpg' && { echo "lista (intento $i)"; exit 0; }
            sleep 10
          done; exit 1
      - run: mkdir -p /tmp/out /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i -s playwright && npx playwright install --with-deps chromium >/dev/null
      - name: Etiquetas Open Graph / Twitter e imagen en la vista previa
        if: always()
        run: |
          curl -s "$P/perfil-santa-latino" | grep -E 'og:|twitter:|rel="canonical"|<title>' | tee /tmp/out/etiquetas.txt
          curl -sI "$P/assets/directorio/perfiles/santa-latino-og-navidad.jpg" | grep -i -E "^(HTTP|content-type|content-length)" | tee /tmp/out/imagen.txt
          curl -s "$P/assets/directorio/perfiles/santa-latino-og-navidad.jpg" -o /tmp/og.jpg; python3 -c "
          from PIL import Image; im=Image.open('/tmp/og.jpg'); print('dimensiones:', im.size, 'formato:', im.format)" 2>/dev/null | tee -a /tmp/out/imagen.txt || file /tmp/og.jpg | tee -a /tmp/out/imagen.txt
          echo "idéntica al repositorio: $(cmp -s /tmp/og.jpg assets/directorio/perfiles/santa-latino-og-navidad.jpg && echo sí || echo NO)" | tee -a /tmp/out/imagen.txt
      - name: E2E Santa Latino y miniweb de Nelson (estadísticas bloqueadas)
        if: always()
        run: |
          r=0
          for t in santa-latino nelson-vahos; do
            BASE=$P SHOTS=/tmp/out NODE_PATH=/tmp/pw/node_modules NODE_OPTIONS="--require $PWD/tmp-prod/sin-estadisticas.cjs" node tests/e2e-$t.cjs 2>&1 | grep -v "^\s*at " | tail -8 | tee /tmp/out/e2e-$t.txt; [ ${PIPESTATUS[0]} = 0 ] || r=1
          done; exit $r
      - name: Publicar
        if: always()
        run: |
          cd /tmp/out && git init -q -b datos && git config user.name datos && git config user.email datos@users.noreply.github.com && git add -A && git commit -qm "vista previa santa og [CF-Pages-Skip]"
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" datos:refs/heads/claude/santa-latino-og-vista-datos-${{ github.run_number }}
