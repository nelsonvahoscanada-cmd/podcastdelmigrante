# TEMPORAL: comprobar enlaces oficiales (solo lectura). Se elimina después.
name: tmp nelson enlaces
on:
  push:
    branches: [claude/nelson-materiales-enlaces]
permissions:
  contents: write
jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: mkdir -p /tmp/out /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i -s playwright && npx playwright install --with-deps chromium >/dev/null
      - run: |
          for u in https://eradioglobal.com https://www.eradioglobal.com; do echo "== $u"; curl -sS -m 30 -o /tmp/e.html -w "HTTP %{http_code} | final %{url_effective} | ip %{remote_ip}\n" -L "$u"; grep -o '<title>[^<]*' /tmp/e.html | head -1; done 2>&1 | tee /tmp/out/eradio-curl.txt
          getent hosts eradioglobal.com | tee -a /tmp/out/eradio-curl.txt || echo "DNS: sin resolución" | tee -a /tmp/out/eradio-curl.txt
      - run: NODE_PATH=/tmp/pw/node_modules node tmp-audit/enlaces.cjs
      - name: Publicar
        if: always()
        run: |
          cd /tmp/out && git init -q -b datos && git config user.name datos && git config user.email datos@users.noreply.github.com && git add -A && git commit -qm "enlaces [CF-Pages-Skip]"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" datos:refs/heads/claude/nelson-materiales-enlaces-datos
