name: tmp verificar menu
on:
  push:
    branches: [claude/laughing-albattani-1rvkc1]
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-save playwright@1 && npx playwright install --with-deps chromium
      - run: mkdir -p shots && BASE=https://b428b4a2.podcastdelmigrante.pages.dev SHOTS=shots node tests/e2e-menu.cjs
      - run: for f in shots/menu-1280.png shots/menu-celular.png; do echo "F|$f"; gzip -c "$f" | base64 -w0 | fold -w 4000 | sed 's/^/C|/'; echo; done
