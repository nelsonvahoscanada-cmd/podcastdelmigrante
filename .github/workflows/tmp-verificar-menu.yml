name: tmp verificar menú (vista previa)
on:
  push:
    branches: [claude/laughing-albattani-1rvkc1]
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-save playwright@1 && npx playwright install --with-deps chromium
      - run: BASE=https://515c5145.podcastdelmigrante.pages.dev node tests/e2e-menu.cjs
      - run: BASE=https://515c5145.podcastdelmigrante.pages.dev node tests/e2e-noticias.cjs
