name: tmp verificar menu produccion
on:
  push:
    branches: [claude/laughing-albattani-1rvkc1]
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-save playwright@1 && npx playwright install --with-deps chromium
      - name: esperar el despliegue
        run: |
          for i in $(seq 1 60); do
            curl -fsS "https://podcastdelmigrante.com/js/nav.js?v=$i" | grep -q 'width="18"' && exit 0
            sleep 15
          done
          exit 1
      - run: mkdir -p shots && BASE=https://podcastdelmigrante.com SHOTS=shots node tests/e2e-menu.cjs
      - run: for f in shots/menu-1280.png shots/menu-celular.png; do echo "F|$f"; gzip -c "$f" | base64 -w0 | fold -w 4000 | sed 's/^/C|/'; echo; done
