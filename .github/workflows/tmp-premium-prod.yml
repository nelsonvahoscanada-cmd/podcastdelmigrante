# TEMPORAL: verificar en producción el PR #137 (solo lectura; sin estadísticas). Se elimina después.
name: tmp premium prod
on:
  push:
    branches: [claude/nelson-premium-cta-prod]
permissions:
  contents: write
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      P: https://podcastdelmigrante.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Esperar el despliegue en producción (máx. 20 min)
        run: |
          for i in $(seq 120); do
            curl -fsS "$P/perfil-nelson-vahos?nc=$i$RANDOM" | grep -q 'biz-premium__btn' && { echo "desplegado (intento $i)"; exit 0; }
            sleep 10
          done; exit 1
      - name: Bloque, botón, precio, archivos y demás miniwebs
        if: always()
        run: |
          mkdir -p /tmp/out
          {
            H=$(curl -s "$P/perfil-nelson-vahos")
            echo "--- Orden de las secciones"
            echo "$H" | tr -d '\n' | grep -oE 'class="biz-section biz-[a-z]+"|class="biz-premium"|id="bizVideoFrame"' | head -8
            echo "--- Botón Premium (href y medición)"
            echo "$H" | grep -o '<a class="biz-btn biz-btn--primary biz-premium__btn"[^>]*>[^<]*</a>'
            echo "--- Precio"
            echo "$H" | grep -o '<p class="biz-premium__precio">.*</p>'
            echo "--- Aclaración"
            echo "$H" | grep -o '<p class="biz-premium__nota">[^<]*</p>'
            echo "--- Estados"
            for u in /perfil-nelson-vahos /css/temas/institucional.css /vcard/nelson-vahos.vcf /assets/qr/perfil-nelson-vahos.svg /assets/qr/contacto-nelson-vahos.svg /assets/qr/perfil-nelson-vahos.png /assets/qr/contacto-nelson-vahos.png /assets/yt/ZlUEYjQpEpE.jpg /perfil-santa-latino /perfil-tomas-velazquez /perfil-1juanromero1 /perfil-carlos-d-castillo; do printf "%-44s %s\n" "$u" "$(curl -s -o /dev/null -w '%{http_code}' "$P$u")"; done
            echo "--- Archivos servidos = repositorio"
            for f in css/temas/institucional.css js/business-profile.js js/businesses.js vcard/nelson-vahos.vcf assets/qr/perfil-nelson-vahos.svg assets/qr/contacto-nelson-vahos.svg assets/directorio/perfiles/nelson-vahos.jpg; do echo "$f: $(curl -s "$P/$f" | cmp -s - $f && echo idéntico || echo DIFERENTE)"; done
            echo "--- Demás miniwebs: HTML servido = repositorio (sin lo que Cloudflare reescribe: correos y su analítica)"
            limpia() { grep -vE 'email-protection|mailto:|cloudflareinsights|data-cfemail|__cf_email__|cdn-cgi'; }
            for f in perfil-santa-latino.html perfil-tomas-velazquez.html perfil-1juanromero1.html perfil-carlos-d-castillo.html; do u="/${f%.html}"; echo "## $u"; diff <(limpia < $f) <(curl -s "$P$u" | limpia) | grep '^[<>]' | cut -c1-300; done
            echo "--- Estadísticas (solo lectura: GET no registra nada)"
            echo "/api/events GET: $(curl -s -o /dev/null -w '%{http_code}' "$P/api/events") (405 = Worker activo, solo acepta POST)"
            echo "data-track en la miniweb: $(echo "$H" | grep -o 'data-track="[a-z_]*" data-track-target="[a-z0-9_-]*"' | sort | uniq -c | tr '\n' ' ')"
          } 2>&1 | tee /tmp/out/estados.txt
      - run: mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i -s playwright && npx playwright install --with-deps chromium >/dev/null
      - name: E2E en producción (estadísticas bloqueadas)
        if: always()
        run: |
          r=0
          for t in nelson-premium nelson-video; do
            BASE=$P SHOTS=/tmp/out NODE_PATH=/tmp/pw/node_modules NODE_OPTIONS="--require $PWD/tmp-prod/sin-estadisticas.cjs" node tests/e2e-$t.cjs 2>&1 | grep -v "^\s*at " | tail -40 | tee /tmp/out/e2e-$t.txt; [ ${PIPESTATUS[0]} = 0 ] || r=1
          done; exit $r
      - name: Publicar
        if: always()
        run: |
          cd /tmp/out && git init -q -b datos && git config user.name datos && git config user.email datos@users.noreply.github.com && git add -A && git commit -qm "producción Premium [CF-Pages-Skip]"
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" datos:refs/heads/claude/nelson-premium-cta-prod-datos-${{ github.run_number }}
