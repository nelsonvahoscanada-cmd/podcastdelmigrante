# TEMPORAL: verificar en la vista previa de Cloudflare el PR #126 (solo lectura; sin estadísticas). Se elimina después.
name: tmp juan preview
on:
  push:
    branches: [claude/juan-nombre-planes-preview]
permissions:
  contents: write
jobs:
  verificar:
    runs-on: ubuntu-latest
    env:
      BASE: https://claude-juan-nombre-planes.podcastdelmigrante.pages.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Esperar la vista previa del PR (máx. 15 min)
        run: |
          for i in $(seq 90); do
            curl -fsS "$BASE/planes-directorio?nc=$i" | grep -q 'href="perfil-1juanromero1"' && curl -fsS "$BASE/vcard/1juanromero1.vcf?nc=$i" | grep -q "Juan Sebastián" && { echo lista; exit 0; }
            sleep 10
          done; exit 1
      - run: mkdir -p /tmp/out /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i -s playwright && npx playwright install --with-deps chromium >/dev/null
      - name: Enlaces de «Planes del Directorio» y vCard
        run: |
          set +e
          for p in perfil-tomas-velazquez perfil-carlos-d-castillo perfil-santa-latino perfil-1juanromero1; do echo "$p: $(curl -s -o /dev/null -w '%{http_code}' "$BASE/$p")"; done | tee /tmp/out/enlaces.txt
          curl -s "$BASE/vcard/1juanromero1.vcf" | grep -E "^(N|FN|ORG|NOTE):" | tee /tmp/out/vcard.txt
          curl -sI "$BASE/vcard/1juanromero1.vcf" | grep -i "content-type" | tee -a /tmp/out/vcard.txt
      - name: Suites e2e (estadísticas simuladas; /api/* nunca llega al servidor)
        run: |
          set +e
          for t in 1juanromero1 planes-directorio santa-latino directorio-visibilidad; do
            r=$(NODE_PATH=/tmp/pw/node_modules NODE_OPTIONS="--require $PWD/tmp-prod/solo-api.cjs" timeout 900 node tests/e2e-$t.cjs 2>&1); c=$?
            echo "$t: $c $(echo "$r" | grep -m1 -E '^OK|Error|assert' | cut -c1-300)" | tee -a /tmp/out/e2e.txt
            [ $c -ne 0 ] && echo "$r" | tail -30 > /tmp/out/fallo-$t.txt
          done; true
      - name: Publicar
        if: always()
        run: |
          cd /tmp/out && git init -q -b datos && git config user.name datos && git config user.email datos@users.noreply.github.com && git add -A && git commit -qm "preview [CF-Pages-Skip]"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" datos:refs/heads/claude/juan-nombre-planes-preview-datos
