# TEMPORAL: verificar en producción el PR #130 (solo lectura; sin estadísticas). Se elimina después.
name: tmp css version prod
on:
  push:
    branches: [claude/fundador-css-version-prod]
permissions:
  contents: write
jobs:
  verificar:
    runs-on: ubuntu-latest
    env:
      P: https://podcastdelmigrante.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Esperar el despliegue en producción (máx. 20 min)
        run: |
          for i in $(seq 120); do
            curl -fsS "$P/?nc=$i$RANDOM" | grep -q 'href="css/styles.css?v=' && { echo "desplegado (intento $i)"; exit 0; }
            sleep 10
          done; exit 1
      - run: mkdir -p /tmp/out /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i -s playwright && npx playwright install --with-deps chromium >/dev/null
      - name: Hoja versionada y estados en producción
        if: always()
        run: |
          h=$(curl -s "$P/" | grep -o 'css/styles.css?v=[0-9a-f]*'); echo "portada → $h" | tee /tmp/out/estados.txt
          curl -sI "$P/$h" | grep -i -E "^(HTTP|cache-control|content-type)" | tee -a /tmp/out/estados.txt
          echo "huella servida: $(curl -s "$P/$h" | sha256sum | cut -c1-10) · repositorio: $(sha256sum < css/styles.css | cut -c1-10)" | tee -a /tmp/out/estados.txt
          for u in / /noticias /magazine/ /quien-puede-ayudarte /perfil-nelson-vahos /perfil-santa-latino /perfil-1juanromero1 /perfil-tomas-velazquez /perfil-carlos-d-castillo /desafio-100-empresas/; do printf "%-40s %s\n" "$u" "$(curl -s -o /dev/null -w '%{http_code}' "$P$u")"; done | tee -a /tmp/out/estados.txt
      - name: Medidas reales (sin caché y con la hoja anterior en caché)
        if: always()
        run: NODE_PATH=/tmp/pw/node_modules node tmp-prod/diag-tarjeta.cjs 2>&1 | tee /tmp/out/medidas.txt
      - name: E2E en producción (estadísticas bloqueadas)
        if: always()
        run: |
          r=0
          for t in fundador-portada nelson-vahos menu noticias; do
            BASE=$P SHOTS=/tmp/out NODE_PATH=/tmp/pw/node_modules NODE_OPTIONS="--require $PWD/tmp-prod/sin-estadisticas.cjs" node tests/e2e-$t.cjs 2>&1 | grep -v "^\s*at " | tail -12 | tee /tmp/out/e2e-$t.txt; [ ${PIPESTATUS[0]} = 0 ] || r=1
          done; exit $r
      - name: Publicar
        if: always()
        run: |
          cd /tmp/out && git init -q -b datos && git config user.name datos && git config user.email datos@users.noreply.github.com && git add -A && git commit -qm "prod css version [CF-Pages-Skip]"
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" datos:refs/heads/claude/fundador-css-version-prod-datos-${{ github.run_number }}
