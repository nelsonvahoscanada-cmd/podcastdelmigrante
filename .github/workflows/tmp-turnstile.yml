name: tmp Turnstile producción (solo lectura)
on:
  push:
    branches: [claude/laughing-albattani-1rvkc1-turnstile]
    paths: [".github/workflows/tmp-turnstile.yml"]
permissions:
  contents: read
jobs:
  produccion:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        navegador: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save playwright@1.47.0 && npx playwright install --with-deps ${{ matrix.navegador }}
      - name: Configuración y JavaScript publicado (solo GET)
        run: |
          echo "::notice title=config::$(curl -s https://podcastdelmigrante.com/registro/config | sed -E 's/"turnstileSiteKey":"(0x[A-Za-z0-9]{6})[^"]*"/"turnstileSiteKey":"\1…"/')"
          echo "::notice title=script::$(curl -s https://podcastdelmigrante.com/registra-tu-empresa | grep -o 'solicitud-form.js?v=[0-9]*')"
          for f in js/directorio/solicitud-form.js js/directorio/solicitud-core.js; do
            a=$(curl -s "https://podcastdelmigrante.com/$f?v=20261028" | sha256sum | cut -c1-16); b=$(sha256sum $f | cut -c1-16)
            echo "::notice title=$f::producción $a · main $b"
          done
      - name: Formulario abierto con el widget real (sin enviar nada)
        env: { NAVEGADOR: "${{ matrix.navegador }}" }
        run: |
          cat > p.cjs <<'JS'
          const pw = require("playwright");
          (async () => {
            const b = await pw[process.env.NAVEGADOR].launch();
            const perfil = process.env.NAVEGADOR === "webkit" ? pw.devices["iPhone 13"] : { viewport: { width: 1366, height: 900 } };
            const c = await b.newContext({ ...perfil, locale: "es-CA" });
            let bloqueados = 0;
            await c.route(/\/registro\/enviar|\/api\//, (r) => { bloqueados++; r.abort(); });
            const p = await c.newPage(); const errores = [];
            p.on("pageerror", (e) => errores.push(e.message.slice(0, 120)));
            await p.goto("https://podcastdelmigrante.com/registra-tu-empresa", { waitUntil: "load" });
            await p.waitForTimeout(12000);
            const d = await p.evaluate(() => ({ aviso: !document.querySelector("#intakeUnavailable").hidden, botonActivo: !document.querySelector("#intakeForm [type=submit]").disabled, campoToken: document.querySelectorAll('#intakeForm input[name="cf-turnstile-response"]').length, script: [...document.scripts].map((s) => s.src).filter((s) => /solicitud-form/.test(s)).join(" ") }));
            console.log(`::notice title=${process.env.NAVEGADOR}-formulario::${JSON.stringify({ ...d, errores, bloqueados })}`);
            await b.close();
          })();
          JS
          node p.cjs
      - name: Renovación del token con el JavaScript publicado (Turnstile y envío simulados en el navegador; nada llega al servidor)
        run: BASE=https://podcastdelmigrante.com NAVEGADOR=${{ matrix.navegador }} node tests/e2e-registro-turnstile.cjs
