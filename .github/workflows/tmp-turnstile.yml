name: tmp Turnstile producción (solo lectura)
on:
  push:
    branches: [claude/laughing-albattani-1rvkc1-turnstile]
    paths: [".github/workflows/tmp-turnstile.yml"]
permissions:
  contents: read
jobs:
  inspeccion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        navegador: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save playwright@1.47.0 && npx playwright install --with-deps ${{ matrix.navegador }}
      - name: Código publicado igual al de main (sin enviar nada)
        run: |
          for f in js/directorio/solicitud-form.js js/directorio/solicitud-core.js; do
            a=$(curl -s "https://podcastdelmigrante.com/$f?v=20261018" | sha256sum | cut -c1-16); b=$(sha256sum $f | cut -c1-16)
            echo "::notice title=$f::producción $a · main $b"
          done
          echo "::notice title=config::$(curl -s https://podcastdelmigrante.com/registro/config)"
      - name: Abrir el formulario y revisar el widget (sin enviar nada)
        env: { NAVEGADOR: "${{ matrix.navegador }}" }
        run: |
          cat > p.cjs <<'JS'
          const pw = require("playwright");
          (async () => {
            const b = await pw[process.env.NAVEGADOR].launch();
            const perfil = process.env.NAVEGADOR === "webkit" ? pw.devices["iPhone 13"] : { viewport: { width: 1366, height: 900 } };
            const c = await b.newContext({ ...perfil, locale: "es-CA" });
            let enviados = 0;
            await c.route(/\/registro\/enviar|\/api\//, (r) => { enviados++; r.abort(); });
            const p = await c.newPage();
            const iframes = [];
            p.on("frameattached", (f) => setTimeout(() => iframes.push(f.url()), 3000));
            await p.goto("https://podcastdelmigrante.com/registra-tu-empresa", { waitUntil: "load" });
            await p.waitForTimeout(20000);
            const cfg = await (await c.request.get("https://podcastdelmigrante.com/registro/config")).json();
            const d = await p.evaluate(() => {
              const f = document.getElementById("intakeForm");
              const dentro = f ? f.querySelectorAll('input[name="cf-turnstile-response"]') : [];
              const todos = document.querySelectorAll('input[name="cf-turnstile-response"]');
              const fd = f ? new FormData(f) : null;
              return { inputsEnFormulario: dentro.length, inputsEnPagina: todos.length, largoValor: dentro[0] ? dentro[0].value.length : -1, enFormData: fd ? fd.has("cf-turnstile-response") : null, largoEnFormData: fd && fd.get("cf-turnstile-response") ? String(fd.get("cf-turnstile-response")).length : 0, iframe: !!document.querySelector("#turnstileBox iframe"), turnstileApi: typeof window.turnstile };
            });
            const frames = p.frames().map((f) => f.url()).filter((u) => u.includes("challenges.cloudflare.com"));
            const claveWidget = (frames.join(" ").match(/0x[0-9A-Za-z_-]{16,}/) || [""])[0];
            console.log(`::notice title=${process.env.NAVEGADOR}::${JSON.stringify({ ...d, claveDelWidgetIgualAConfig: claveWidget ? claveWidget === cfg.turnstileSiteKey : "no visible", envios: enviados })}`);
            await b.close();
          })();
          JS
          node p.cjs
