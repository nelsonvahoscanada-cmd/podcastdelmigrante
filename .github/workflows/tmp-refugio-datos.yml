name: tmp refugio datos
on:
  push:
    branches: [claude/laughing-albattani-1rvkc1-refugio-datos]
    paths: [".github/workflows/tmp-refugio-datos.yml", ".github/refugio/*"]
permissions:
  contents: write
jobs:
  datos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q playwright==1.48.0 && python -m playwright install --with-deps chromium >/dev/null
      - name: Datos
        continue-on-error: true
        run: mkdir -p /tmp/out && python .github/refugio/datos.py 2>&1 | tee /tmp/out/log.txt
      - name: Publicar
        if: always()
        run: |
          cd /tmp/out && git init -q -b datos && git config user.name datos && git config user.email datos@users.noreply.github.com && git add -A && git commit -qm "Datos refugio [CF-Pages-Skip]"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" datos:refs/heads/claude/laughing-albattani-1rvkc1-refugio-datos-out2
