# TEMPORAL: verificar en producción la guía de los Territorios del Noroeste (solo lectura; sin estadísticas). Se elimina después.
name: verificar-nwt
on:
  push:
    branches: [claude/nwt-canada-en-datos-prod]
permissions:
  contents: read
jobs:
  prod:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://podcastdelmigrante.com; G=/canada-en-datos/northwest-territories
          for i in $(seq 1 40); do c=$(curl -s -o /dev/null -w "%{http_code}" "$B$G?t=$RANDOM"); [ "$c" = 200 ] && { echo "desplegado (intento $i)"; break; }; if [ $i = 40 ]; then exit 1; fi; sleep 15; done
          for r in $G $G/yellowknife $G/inuvik $G/hay-river $G/fort-smith $G/deline $G/beaufort-delta-zona-no-organizada /canada-en-datos/ /canada-en-datos/alberta /canada-en-datos/nunavut/iqaluit /assets/canada-en-datos/social-northwest-territories.jpg /assets/canada-en-datos/bandera-northwest-territories.svg /assets/canada-en-datos/northwest-territories/yellowknife.jpg /js/northwest-territories-localidades.js; do curl -s -o /dev/null -w "$r: %{http_code} %{content_type}\n" "$B$r"; done
          curl -s -o /dev/null -w "$G/yellowknife.html: %{http_code} → %{redirect_url}\n" "$B$G/yellowknife.html"
          curl -s -o /dev/null -w "$G/no-existe: %{http_code}\n" "$B$G/no-existe"
          curl -s "$B$G" | grep -oE '<title>[^<]*</title>|(property|name)="(og:title|og:image|og:url|twitter:image)" content="[^"]*"|rel="canonical" href="[^"]*"'
          curl -s "$B/sitemap.xml" | grep -c "northwest-territories" | sed 's/^/sitemap: /'
          mkdir v && cd v && npm init -y >/dev/null && npm i -s playwright@1.49.1 >/dev/null && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > v.cjs <<'JS'
          const { chromium, devices } = require("playwright");
          const B = "https://podcastdelmigrante.com", G = "/canada-en-datos/northwest-territories";
          (async () => { const br = await chromium.launch(); let f = 0; const ok = (c, m) => { console.log((c ? "OK   " : "FALLA") + " " + m); if (!c) f++; };
            for (const [n, p] of [["computador", { viewport: { width: 1440, height: 900 } }], ["celular", devices["iPhone 13"]]]) {
              const ctx = await br.newContext({ ...p, locale: "es-CA" });
              await ctx.route(/\/api\/(vistas|events)/, (r) => r.fulfill({ status: 204, body: "" }));
              const pg = await ctx.newPage(); const err = []; pg.on("pageerror", (e) => err.push(e.message)); pg.on("console", (m) => m.type() === "error" && err.push(m.text()));
              const sinScroll = async () => { const [sw, cw] = await pg.evaluate(() => [document.documentElement.scrollWidth, document.documentElement.clientWidth]); return sw <= cw + 1; };
              await pg.goto(B + G, { waitUntil: "networkidle" });
              ok((await pg.locator("h1").first().textContent()).trim() === "Territorios del Noroeste", `${n} ficha: título`);
              ok(await pg.locator("h1 img.cd-flag").evaluate((i) => i.complete && i.naturalWidth > 0), `${n} bandera cargada`);
              const ids = ["poblacion","idiomas","geografia","economia","empleo","inmigracion","vivienda","salud","educacion","transporte","beneficios","integracion","seguridad","vida","ciudades","localidades","recien-llegado","estafas","noticias","fuentes"];
              ok((await Promise.all(ids.map((i) => pg.locator("#" + i).count()))).every((c) => c === 1), `${n} 20 secciones`);
              const ind = await pg.locator(".cd-indicator").evaluateAll((d) => d.map((x) => x.textContent));
              ok(ind.length >= 10 && ind.filter((t) => /\d/.test(t)).every((t) => /Fuente|Statistics Canada|Job Bank|Gobierno|CMHC|Consultado/.test(t)), `${n} indicadores con fuente (${ind.length})`);
              await pg.waitForFunction(() => /\d/.test(document.querySelector("#cdClock [data-reloj-hora]").textContent));
              const hora = (await pg.locator("#cdClock [data-reloj-hora]").textContent()).trim();
              const esperada = Number(new Intl.DateTimeFormat("en-CA", { timeZone: "America/Yellowknife", hour: "numeric", hour12: true }).formatToParts(new Date()).find((x) => x.type === "hour").value);
              const utc6 = Number(new Intl.DateTimeFormat("en-CA", { timeZone: "Etc/GMT+6", hour: "numeric", hour12: true }).formatToParts(new Date()).find((x) => x.type === "hour").value);
              ok(Number(hora.split(":")[0]) === esperada, `${n} reloj = America/Yellowknife (${hora}; UTC−6 sería ${utc6}; tzdata del navegador de prueba ${process.versions.tz || "?"})`);
              await pg.locator("#cdLoc").scrollIntoViewIfNeeded(); await pg.waitForFunction(() => !document.getElementById("cdLocBuscar").disabled);
              ok(await pg.evaluate(() => window.CD_LOCALIDADES.localidades.filter((x) => x[7]).length) === 41, `${n} directorio: 41 páginas`);
              await pg.locator("#cdLocBuscar").fill("fort franklin");
              ok(await pg.waitForFunction(() => document.querySelector('#cdLocLista a[href$="/northwest-territories/deline"]')).then(() => true).catch(() => false), `${n} búsqueda por nombre anterior`);
              ok(await sinScroll(), `${n} sin desplazamiento horizontal (ficha)`);
              ok(err.length === 0, `${n} sin errores JS ficha ${JSON.stringify(err)}`); err.length = 0;
              for (const s of ["yellowknife", "paulatuk"]) {
                await pg.goto(B + G + "/" + s, { waitUntil: "networkidle" });
                ok((await pg.locator("[data-reloj-localidad]").getAttribute("data-zona")) === "America/Yellowknife", `${n} ${s}: reloj America/Yellowknife`);
                const v = await pg.locator("#vivienda").textContent();
                ok(s === "yellowknife" ? /\$2,109 al mes/.test(v) && /120 a 125/.test(v) : /185 a 190/.test(v), `${n} ${s}: vivienda y costo de vida`);
                ok(await sinScroll(), `${n} ${s}: sin desplazamiento horizontal`);
              }
              ok(err.length === 0, `${n} sin errores JS comunidades ${JSON.stringify(err)}`); err.length = 0;
              await pg.goto(B + "/canada-en-datos/", { waitUntil: "networkidle" });
              ok(await pg.locator('path.cd-region--ficha[data-code="NT"]').count() === 1, `${n} mapa: NWT como ficha disponible`);
              ok(await pg.locator('path.cd-region--ficha[data-code="YT"]').count() === 0, `${n} mapa: Yukón sigue sin ficha`);
              await pg.locator('path[data-code="NT"]').dispatchEvent("click");
              await pg.waitForFunction(() => document.querySelector('#cdPanel a[href="/canada-en-datos/northwest-territories"]'));
              await pg.locator('#cdPanel a[href="/canada-en-datos/northwest-territories"]').click();
              await pg.waitForURL(/northwest-territories$/); ok(true, `${n} mapa → ficha`);
              await pg.locator('.cd-breadcrumb a[href="/canada-en-datos/"]').click(); await pg.waitForURL(/canada-en-datos\/$/); ok(true, `${n} ficha → mapa`);
              await pg.goto(B + "/canada-en-datos/alberta", { waitUntil: "networkidle" });
              ok((await pg.locator("h1").first().textContent()).trim() === "Alberta" && (await pg.locator("h1 img.cd-flag").count()) === 0, `${n} Alberta intacta`);
              ok(err.length === 0, `${n} sin errores JS mapa/Alberta ${JSON.stringify(err)}`);
              await ctx.close();
            } await br.close(); process.exit(f ? 1 : 0); })();
          JS
          node v.cjs
