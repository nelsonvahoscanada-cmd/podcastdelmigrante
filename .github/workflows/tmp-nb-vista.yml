# TEMPORAL: verificar la vista previa del PR #136 (solo lectura; sin estadísticas). Se elimina después.
name: tmp nb vista previa
on:
  push:
    branches: [claude/canada-datos-nb-vista]
permissions:
  contents: write
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      P: https://claude-canada-datos-new-brun.podcastdelmigrante.pages.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Esperar la vista previa (máx. 20 min)
        run: |
          for i in $(seq 120); do
            curl -fsS "$P/canada-en-datos/new-brunswick?nc=$i$RANDOM" | grep -q 'Explora las ciudades y pueblos de Nuevo Brunswick' && { echo "lista (intento $i)"; exit 0; }
            sleep 10
          done; exit 1
      - name: Estados HTTP
        if: always()
        run: |
          mkdir -p /tmp/out
          for u in /canada-en-datos/ /canada-en-datos/new-brunswick /canada-en-datos/new-brunswick/moncton /canada-en-datos/new-brunswick/campbellton /canada-en-datos/new-brunswick/moncton-parish /assets/canada-en-datos/social-new-brunswick.jpg /js/new-brunswick-localidades.js /canada-en-datos/prince-edward-island /canada-en-datos/yukon /canada-en-datos/alberta /canada-en-datos/quebec; do printf "%-60s %s\n" "$u" "$(curl -s -o /dev/null -w '%{http_code}' "$P$u")"; done | tee /tmp/out/estados.txt
      - run: mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i -s playwright && npx playwright install --with-deps chromium >/dev/null
      - name: E2E (iPhone SE, iPhone 13, iPhone 14 Pro Max, tableta, computador)
        if: always()
        run: |
          r=0
          for t in canada-datos; do
            BASE=$P SHOTS=/tmp/out NODE_PATH=/tmp/pw/node_modules NODE_OPTIONS="--require $PWD/tmp-prod/sin-estadisticas.cjs" node tests/e2e-$t.cjs 2>&1 | grep -v "^\s*at " | tail -60 | tee /tmp/out/e2e-$t.txt; [ ${PIPESTATUS[0]} = 0 ] || r=1
          done; exit $r
      - name: Publicar
        if: always()
        run: |
          cd /tmp/out && git init -q -b datos && git config user.name datos && git config user.email datos@users.noreply.github.com && git add -A && git commit -qm "vista previa Nuevo Brunswick [CF-Pages-Skip]"
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" datos:refs/heads/claude/canada-datos-nb-vista-datos-${{ github.run_number }}
