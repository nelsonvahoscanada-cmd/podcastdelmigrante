name: "Registro de empresas: pruebas"

# Validación, ficha para js/businesses.js y armado del envío del
# formulario de registra-tu-empresa.html (sin enviar correos reales).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test tests/*.test.mjs
