name: "Registro de empresas: pruebas"

# Registro de empresas (formulario, Function /registro/enviar con D1/R2
# simulados, correos) y panel privado. Sin enviar correos reales.
# Node 22: las pruebas usan SQLite integrado (node:sqlite) para simular D1.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --no-warnings --test tests/*.test.mjs
      # Panel privado (solicitudes, estadísticas)
      - run: node --no-warnings --test admin-worker/test/*.test.js
