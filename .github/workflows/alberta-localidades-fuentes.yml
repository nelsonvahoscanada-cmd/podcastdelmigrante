# TEMPORAL: consulta de solo lectura de fuentes oficiales de localidades de Alberta. Se elimina al terminar.
name: alberta-localidades-fuentes
on:
  push:
    branches: [claude/alberta-localidades]
    paths: [.github/workflows/alberta-localidades-fuentes.yml, scripts/canada-en-datos/obtener-localidades.py, scripts/canada-en-datos/consultar-ciudades.py]
permissions:
  contents: read
jobs:
  consultar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q openpyxl shapely
      - run: python3 scripts/canada-en-datos/consultar-ciudades.py
