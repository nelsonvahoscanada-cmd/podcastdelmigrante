# TEMPORAL: comprobación de solo lectura de Canadá en Datos en producción. Se elimina después de usarse.
name: canada-datos-produccion
on:
  push:
    branches: [claude/canada-en-datos]
    paths: [.github/workflows/canada-datos-produccion.yml]
permissions:
  contents: read
jobs:
  produccion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cabeceras y metadatos
        run: |
          for u in https://www.podcastdelmigrante.com/canada-en-datos/ https://www.podcastdelmigrante.com/canada-en-datos/alberta https://podcastdelmigrante.com/canada-en-datos/ https://podcastdelmigrante.com/canada-en-datos/alberta; do
            echo "=== $u"
            curl -sSL -o /tmp/p.html -w "final=%{url_effective} status=%{http_code} redirects=%{num_redirects}\n" "$u"
            grep -o '<title>[^<]*</title>' /tmp/p.html
            grep -oE '<link rel="canonical"[^>]*>|<meta (property|name)="(og:[a-z:]+|twitter:[a-z]+|robots)"[^>]*>' /tmp/p.html
            grep -c 'noindex' /tmp/p.html || true
            grep -c 'Prototipo en revisión' /tmp/p.html || true
          done
          for a in social-canada-en-datos.jpg social-alberta.jpg; do curl -sS -o /dev/null -w "$a %{http_code} %{content_type} %{size_download}\n" https://podcastdelmigrante.com/assets/canada-en-datos/$a; done
          curl -sS https://podcastdelmigrante.com/sitemap.xml | grep canada
          curl -sS https://podcastdelmigrante.com/js/data.js | grep '"Canadá", href'
      - name: Navegador (computador, tableta y celular) contra producción
        run: |
          npm i --no-save playwright@1.48.2 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          BASE=https://podcastdelmigrante.com node tests/e2e-canada-datos.cjs
