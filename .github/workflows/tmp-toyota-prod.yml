name: tmp toyota produccion
on:
  push:
    branches: [claude/laughing-albattani-1rvkc1-toyota-prod]
    paths: [".github/workflows/tmp-toyota-prod.yml"]
permissions:
  contents: write
jobs:
  produccion:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Esperar el despliegue de produccion
        run: for i in $(seq 1 60); do curl -sL https://podcastdelmigrante.com/js/data.js | grep -q 'utm_campaign=country-hills-toyota' && echo listo && exit 0; sleep 20; done; exit 1
      - run: mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.48.0 >/dev/null && npx playwright install --with-deps chromium >/dev/null
      - name: Simulador del contador y sin Web Analytics (no genera visitas)
        run: |
          cat > /tmp/pw/vistas.cjs <<'JS'
          const pw = require("/tmp/pw/node_modules/playwright");
          const orig = pw.chromium.launch.bind(pw.chromium);
          pw.chromium.launch = async (...a) => {
            const b = await orig(...a);
            const nc = b.newContext.bind(b);
            b.newContext = async (...o) => { const c = await nc(...o); await c.route(/\/api\/(vistas|events)/, (r) => r.fulfill({ status: 200, contentType: "application/json", body: '{"ok":true,"vistas":0}' })); return c; };
            b.newPage = async (...o) => { const c = await b.newContext(...o); return c.newPage(); };
            return b;
          };
          JS
      - name: Archivos y redireccion
        continue-on-error: true
        run: |
          mkdir -p /tmp/out; B=https://podcastdelmigrante.com
          { for f in js/data.js js/main.js css/styles.css; do curl -sfL "$B/$f" -o /tmp/x; if cmp -s /tmp/x "$f"; then echo "IGUAL $f"; else echo "DISTINTO $f"; fi; done
            curl -s -o /dev/null -w "%{http_code} %{redirect_url}\n" "$B/perfil-tomas-velazquez.html?utm_source=podcastdelmigrante&utm_medium=patrocinio&utm_campaign=country-hills-toyota&utm_content=logo-portada"
            curl -sL -o /dev/null -w "final %{http_code} %{url_effective}\n" "$B/perfil-tomas-velazquez.html?utm_source=podcastdelmigrante&utm_medium=patrocinio&utm_campaign=country-hills-toyota&utm_content=logo-portada"; } | tee /tmp/out/archivos.txt
      - name: E2E en produccion
        env:
          BASE: https://podcastdelmigrante.com
          NODE_PATH: /tmp/pw/node_modules
          NODE_OPTIONS: --require /tmp/pw/vistas.cjs
        run: |
          set +e; mkdir -p /tmp/out/shots
          for t in patrocinadores menu ediciones; do
            if [ $t = patrocinadores ]; then export SHOTS=/tmp/out/shots; else unset SHOTS; fi
            node tests/e2e-$t.cjs > /tmp/out/$t.log 2>&1; e=$?
            if [ $e != 0 ]; then mv /tmp/out/$t.log /tmp/out/$t-intento1.log; node tests/e2e-$t.cjs > /tmp/out/$t.log 2>&1; e=$?; fi
            echo "exit $e $t" | tee -a /tmp/out/resultado.txt; tail -5 /tmp/out/$t.log
          done
      - name: Publicar capturas en la rama de datos
        if: always()
        run: |
          cd /tmp/out && git init -q -b datos && git config user.name "datos" && git config user.email "datos@users.noreply.github.com"
          git add -A && git commit -qm "Verificacion Toyota en produccion [CF-Pages-Skip]"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" datos:refs/heads/claude/laughing-albattani-1rvkc1-toyota-datos
